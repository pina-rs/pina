[package]
name = "multisig-program-surfpool-tests"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Compiles the deferred audit acceptance tests whose exploits are still live
# pending a maintainer decision (see the `audit_sec_11` doc comment). Default
# runs — plain `cargo test` and `pina test` — never see them.
audit-deferred = []

[dependencies]
# The program is a cdylib only (see ../../Cargo.toml), so its types are
# included with #[path = "../../../src/lib.rs"] in src/lib.rs rather than
# through an rlib. The program's `pina` features must be mirrored here so
# the included source compiles identically.
pina = { workspace = true, features = ["account-resize", "compact", "derive", "logs", "token"] }
pina_test = { workspace = true }
