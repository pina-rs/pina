[package]
name = "vesting_program"
version = "0.0.0"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = false
readme.workspace = true
repository.workspace = true

[lib]
# cdylib only: a `lib` output in the same rustc invocation blocks `-C lto`,
# which costs 20-30% of the deployed size. Tests include the real source
# with `#[path = "../../../src/lib.rs"]` from `tests/surfpool` instead of
# depending on an rlib.
crate-type = ["cdylib"]

[features]
bpf-entrypoint = []

[dependencies]
pina = { workspace = true, features = ["logs", "derive", "token"] }

[dev-dependencies]
# The tests/ integration tests include src/lib.rs with #[path] (the program
# is a cdylib only), so the pina features the included source needs must be
# visible to the test targets too.
mollusk-svm = { workspace = true, default-features = true }
pina = { workspace = true, features = ["logs", "derive", "token"] }
solana-account = { workspace = true, default-features = true }
solana-instruction = { workspace = true, default-features = true }
solana-pubkey = { workspace = true, default-features = true }
solana-sdk-ids = { workspace = true, default-features = true }
solana-system-interface = { workspace = true, default-features = true }

[lints]
workspace = true
