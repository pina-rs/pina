[package]
name = "escrow_program"
version = "0.0.0"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = false
readme.workspace = true
repository.workspace = true

[lib]
# cdylib only: a `lib` output in the same invocation blocks `-C lto`, which
# costs roughly 20-30% of the deployed size (37% for this program). Tests
# reach the real source through `#[path]` includes in `tests/surfpool`.
crate-type = ["cdylib"]

[features]
bpf-entrypoint = []

[dependencies]
pina = { workspace = true, features = ["account-resize", "logs", "token", "derive"] }

[dev-dependencies]
mollusk-svm = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["full"], default-features = true }

[lints]
workspace = true
