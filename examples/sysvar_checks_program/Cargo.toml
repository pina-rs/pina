[package]
name = "sysvar_checks_program"
version = "0.0.0"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = false
readme = "readme.md"
repository.workspace = true

[lib]
# cdylib only: a `lib` output in the same rustc invocation blocks `-C lto`,
# which costs 20-30% of the deployed size. Tests include the real source
# with `#[path = "../../../src/lib.rs"]` from `tests/surfpool` instead of
# depending on an rlib.
crate-type = ["cdylib"]

[features]
bpf-entrypoint = []

[dependencies]
pina = { workspace = true, features = ["derive"] }

[lints]
workspace = true
