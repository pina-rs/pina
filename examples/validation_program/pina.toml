[project]
program = "."
idl_dir = "{{root}}/codama/idls"

[clients]
output = "{{root}}/codama/clients"
languages = ["cpi", "rust", "typescript", "dart", "cli-rust", "cli-ts", "cli-dart"]

[clients.typescript]
output = "js"

[clients.cli_rust]
output = "cli/rust"

[clients.cli_ts]
output = "cli/ts"

[clients.cli_dart]
output = "cli/dart"
