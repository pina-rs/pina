name: pina_cli_apps
description: CLI applications generated by Pina from Codama IDLs.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

executables:
  account-realloc-program: account_realloc_program
  compact-accounts-program: compact_accounts_program
  counter-program: counter_program
  custom-errors-program: custom_errors_program
  declare-id-program: declare_id_program
  declare-program: declare_program
  duplicate-mutable-accounts-program: duplicate_mutable_accounts_program
  escrow-program: escrow_program
  events-program: events_program
  float-accounts-program: float_accounts_program
  hello-solana-program: hello_solana_program
  optional-accounts-program: optional_accounts_program
  pina-bpf-program: pina_bpf_program
  profile-program: profile_program
  prop-amm-program: prop_amm_program
  role-registry-program: role_registry_program
  staking-rewards-program: staking_rewards_program
  system-accounts-program: system_accounts_program
  sysvar-checks-program: sysvar_checks_program
  todo-program: todo_program
  transfer-sol-program: transfer_sol_program
  validation-program: validation_program
  vesting-program: vesting_program

dependencies:
  args: ^2.7.0
  pina_codama_clients:
    path: ../../dart
  solana_kit_accounts: ^0.8.0
  solana_kit_address: ^0.8.0
  solana_kit_keys: ^0.8.0
  solana_kit_rpc: ^0.8.0
  solana_kit_transaction_messages: ^0.8.0
  solana_kit_transactions: ^0.8.0

dev_dependencies:
  test: ^1.25.0
