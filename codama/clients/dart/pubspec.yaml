name: pina_codama_clients
description: Generated Dart clients and byte-level contracts for Pina examples.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  meta: ^1.16.0
  solana_kit_accounts: ^0.7.0
  solana_kit_addresses: ^0.7.0
  solana_kit_codecs_core: ^0.7.0
  solana_kit_codecs_data_structures: ^0.7.0
  solana_kit_codecs_numbers: ^0.7.0
  solana_kit_codecs_strings: ^0.7.0
  solana_kit_errors: ^0.7.0
  solana_kit_instructions: ^0.7.0
  solana_kit_rpc_types: ^0.7.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Temporary immutable overrides for unreleased Solana Kit codec fixes. Remove
# these Git pins after PRs #216, #217, and #218 are available from pub.dev.
dependency_overrides:
  solana_kit_codecs_core:
    git:
      url: https://github.com/openbudgetfun/solana_kit.git
      ref: fc48fe148cfd0887dae1601075f83960b6db0538
      path: packages/solana_kit_codecs_core
  solana_kit_codecs_data_structures:
    git:
      url: https://github.com/openbudgetfun/solana_kit.git
      ref: f26e9cd0e3f6248c9b93204910b7ca8f347a4580
      path: packages/solana_kit_codecs_data_structures
  solana_kit_codecs_strings:
    git:
      url: https://github.com/openbudgetfun/solana_kit.git
      ref: f72d3a33abc0b2825320dbd5f7df0397e8790438
      path: packages/solana_kit_codecs_strings
  solana_kit_errors:
    git:
      url: https://github.com/openbudgetfun/solana_kit.git
      ref: f26e9cd0e3f6248c9b93204910b7ca8f347a4580
      path: packages/solana_kit_errors
