packages:
  - .
  - packages/*
  - codama/tests/js
  - codama/tests/litesvm
  - codama/tests/quasar-svm
  - codama/tests/surfpool

linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  esbuild: true
  koffi: true

audit:
  level: moderate

minimumReleaseAgeExclude:
  - "@pina-rs/cli-darwin-arm64@0.13.0 || 0.14.0"
  - "@pina-rs/cli-darwin-x64@0.13.0 || 0.14.0"
  - "@pina-rs/cli-freebsd-x64@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-arm64-gnu@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-arm64-musl@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-x64-gnu@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-x64-musl@0.13.0 || 0.14.0"
  - "@pina-rs/cli-win32-arm64-msvc@0.13.0 || 0.14.0"
  - "@pina-rs/cli-win32-x64-msvc@0.13.0 || 0.14.0"
  - "@pina-rs/cli@0.13.0 || 0.14.0"
  - "@solana/surfpool-darwin-arm64@1.6.0"
  - "@solana/surfpool-darwin-x64@1.6.0"
  - "@solana/surfpool-linux-x64-gnu@1.6.0"
  - "@solana/surfpool@1.6.0"

onlyBuiltDependencies:
  - esbuild
  - koffi

overrides:
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  "vite@>=7.0.0 <=7.3.4": 7.3.5
  "ws@>=8.0.0 <8.21.0": 8.21.0

useNodeVersion: 24.13.0
