packages:
  - .
  - packages/*
  - codama/tests/js
  - codama/tests/litesvm
  - codama/tests/quasar-svm
  - codama/tests/surfpool

linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  esbuild: true
  koffi: true

audit:
  level: moderate

# Advisories with no patched release. Each entry needs a reachability note, a
# review date, and a removal condition; prefer an `overrides` pin to a patched
# version whenever one exists.
auditConfig:
  ignoreGhsas:
    # GHSA-fc5q-39xc-vjpf: picomatch <=4.0.7 ReDoS through repeated extglobs.
    # No patched release exists (4.0.7 is the latest). Reached only through
    # devDependencies (vitest, vite, fdir and tsup in the renderer packages and
    # the codama e2e test projects): `pnpm why -r --prod picomatch` and
    # `pnpm ls -r --prod --depth Infinity` find no picomatch, so no published
    # package's runtime graph includes it. Reviewed 2026-11-18. Once picomatch
    # publishes a fix, widen the `overrides` selector below to cover every
    # affected version (it stops at <4.0.4 today), regenerate pnpm-lock.yaml,
    # confirm no version <=4.0.7 remains, and then remove this entry.
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - "@pina-rs/cli-darwin-arm64@0.13.0 || 0.14.0"
  - "@pina-rs/cli-darwin-x64@0.13.0 || 0.14.0"
  - "@pina-rs/cli-freebsd-x64@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-arm64-gnu@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-arm64-musl@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-x64-gnu@0.13.0 || 0.14.0"
  - "@pina-rs/cli-linux-x64-musl@0.13.0 || 0.14.0"
  - "@pina-rs/cli-win32-arm64-msvc@0.13.0 || 0.14.0"
  - "@pina-rs/cli-win32-x64-msvc@0.13.0 || 0.14.0"
  - "@pina-rs/cli@0.13.0 || 0.14.0"
  - "@solana/surfpool-darwin-arm64@1.6.0 || 1.7.0"
  - "@solana/surfpool-darwin-x64@1.6.0 || 1.7.0"
  - "@solana/surfpool-linux-x64-gnu@1.6.0 || 1.7.0"
  - "@solana/surfpool@1.6.0 || 1.7.0"

onlyBuiltDependencies:
  - esbuild
  - koffi

overrides:
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "vite@>=7.0.0 <=7.3.6": 7.3.7
  "ws@>=8.0.0 <8.21.0": 8.21.0

useNodeVersion: 24.13.0
