name: "docs-pages"

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "template.t.md"
      - "api-docs.t.md"
      - "readme.md"
      - "devenv.nix"
      - "scripts/docs/build-landing.ts"
      - ".github/workflows/docs-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  authorize:
    uses: $/.github/workflows/authorize-main.yml

  build:
    name: build documentation
    needs: authorize
    if: >-
      github.repository_owner == 'pina-rs' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    permissions:
      contents: read # Read documentation and source files from the repository.
      pages: read # Read the GitHub Pages site configuration.
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt,rustc-dev,llvm-tools
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: install docs tools
        uses: $/.github/actions/install-tools
        with:
          tools: dprint@0.64.1,shfmt@3.14.1,mdbook@0.5.4
          mdt: "true"
          nixfmt: "true"

      - name: configure github pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: verify docs
        run: node scripts/ci-tasks.ts verify:docs
        shell: bash

      # Builds the book and renders the pina.rs landing page over its root
      # index. The custom domain itself is set in the repository's Pages
      # settings; Actions deployments ignore the CNAME file mdBook writes.
      - name: build mdBook docs
        run: node scripts/ci-tasks.ts docs:build
        shell: bash

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: deploy documentation
    if: github.repository_owner == 'pina-rs'
    needs: [authorize, build]
    permissions:
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
      pages: write # Publish the built documentation artifact to GitHub Pages.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
