name: "docs-pages"

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "template.t.md"
      - "api-docs.t.md"
      - "readme.md"
      - "devenv.nix"
      - ".github/workflows/docs-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build documentation
    if: >-
      github.repository_owner == 'pina-rs' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    permissions:
      contents: read # Read documentation and source files from the repository.
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure github pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: verify docs
        run: verify:docs
        shell: devenv shell -c -- bash -e {0}

      - name: build mdBook docs
        run: docs:build
        shell: devenv shell -c -- bash -e {0}

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: deploy documentation
    if: github.repository_owner == 'pina-rs'
    needs: build
    permissions:
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
      pages: write # Publish the built documentation artifact to GitHub Pages.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
