name: "ci"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pull requests run a fast, high-confidence subset: every job is gated on the
# paths that can actually affect it, and the deepest verification tiers
# (kani compact proofs, program e2e, dedicated build) are deferred to the
# post-merge run on `main`. Pushes to `main` always run everything, so the
# full suite still executes once per merged change.
#
# Path gating uses job-level conditions instead of workflow-level `paths:`
# filters because every job here is a required status check: a skipped job
# reports "Skipped", which branch protection treats as success, while a
# workflow that never runs leaves the check in "Expected" and blocks merging.
# Skipped jobs are also far cheaper: they never check out or set up devenv.
#
# Add the `ci-full` label to a pull request to run every tier, including the
# main-only jobs, before merging.
jobs:
  changes:
    name: detect changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # Pushes to `main` run every job regardless of paths, so the detection
    # job (and its failure modes) only exists on pull requests.
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      core: ${{ steps.filter.outputs.core_any_changed }}
      cli: ${{ steps.filter.outputs.cli_any_changed }}
      rust: ${{ steps.filter.outputs.rust_any_changed }}
      js: ${{ steps.filter.outputs.js_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      idl: ${{ steps.filter.outputs.idl_any_changed }}
      pina_test: ${{ steps.filter.outputs.pina_test_any_changed }}
      fuzz: ${{ steps.filter.outputs.fuzz_any_changed }}
      changesets: ${{ steps.filter.outputs.changesets_any_changed }}
      toolchain: ${{ steps.filter.outputs.toolchain_any_changed }}
      workflows: ${{ steps.filter.outputs.workflows_any_changed }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify changed paths
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            core:
              - crates/pina/**
              - crates/pina_macros/**
              - crates/pina_abi/**
            cli:
              - crates/pina_cli/**
              - crates/pina_abi/**
              - crates/pina_cli_renderer/**
              - crates/pina_codama_renderer/**
              - crates/pina_cpi_renderer/**
              - crates/pina_profile/**
            rust:
              - crates/**
              - examples/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
            js:
              - codama/**
              - scripts/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
              - tsconfig.scripts.json
            docs:
              - docs/**
              - template.t.md
              - api-docs.t.md
              - readme.md
            idl:
              - codama/**
              - examples/**
              - crates/pina_macros/**
              - crates/pina_codama_renderer/**
              - crates/pina_cpi_renderer/**
              - scripts/generate-codama-idls.sh
              - scripts/verify-codama-idls.sh
              - pnpm-lock.yaml
            pina_test:
              - crates/pina_test/**
            fuzz:
              - crates/pina_fuzz/**
            changesets:
              - .changeset/**
            toolchain:
              - rust-toolchain.toml
              - devenv.nix
              - devenv.lock
              - devenv.yaml
              - .github/actions/devenv/**
            workflows:
              - .github/**

  lint:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    needs: changes
    # The status functions are required: without one, a skipped `changes`
    # dependency (pushes to `main`) would skip this job too.
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Formatting and doc-block sync apply to every file type, so they run on
      # every pull request. The heavy compilers only run when the change can
      # affect them.
      - name: lint format
        run: lint:format
        shell: devenv shell -c -- bash -e {0}

      - name: check synced docs blocks
        run: docs:check
        shell: devenv shell -c -- bash -e {0}

      - name: lint monochange
        run: lint:monochange
        shell: devenv shell -c -- bash -e {0}

      - name: lint rust
        if: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: lint:clippy
        shell: devenv shell -c -- bash -e {0}

      - name: verify docs
        if: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: verify:docs
        shell: devenv shell -c -- bash -e {0}

      - name: install js dependencies
        if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: devenv shell -c -- bash -e {0}

      - name: type-check scripts and js clients
        if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          pnpm run check:scripts
          pnpm run check:js
        shell: devenv shell -c -- bash -e {0}

  security:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run Pina security lints
        run: security:pina-lint
        shell: devenv shell -c -- bash -e {0}

      - name: audit Rust dependencies
        run: security:audit
        shell: devenv shell -c -- bash -e {0}

      - name: audit npm dependencies
        run: security:npm-audit
        shell: devenv shell -c -- bash -e {0}

  cargo-deny:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: check dependency policy
        run: security:deny
        shell: devenv shell -c -- bash -e {0}

  zizmor:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.workflows == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: audit GitHub Actions
        run: security:zizmor
        shell: devenv shell -c -- bash -e {0}

  test:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run tests
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          test:all
        shell: devenv shell -- bash -e {0}

  windows-cli:
    name: windows CLI
    timeout-minutes: 20
    runs-on: windows-latest
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly-2026-02-20

      - name: test CLI portability
        run: cargo test --locked --all-features -p pina_cli

  pina-test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.pina_test == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: verify isolated Surfpool test support
        run: verify:pina-test
        shell: devenv shell -c -- bash -e {0}

  fuzz:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.fuzz == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: replay corpus and fuzz for a bounded duration
        run: test:fuzz:smoke
        shell: devenv shell -c -- bash -e {0}

      - name: upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: crates/pina_fuzz/fuzz/artifacts
          if-no-files-found: ignore

  miri:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run miri zero-copy regressions
        run: test:miri
        shell: devenv shell -c -- bash -e {0}

  kani-quick:
    name: kani (quick)
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run fast kani proofs
        run: test:kani:quick
        shell: devenv --profile kani shell -c -- bash -e {0}

  # The bounded state-machine proofs are the slowest verification tier, so
  # they only run after merge on `main`. Label a pull request `ci-full` to
  # run them before merging.
  kani-compact:
    name: kani (compact layouts)
    timeout-minutes: 50
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run compact-layout kani proofs
        run: test:kani:compact
        shell: devenv --profile kani shell -c -- bash -e {0}

  feature-matrix:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            build_task: build:pina:default
            test_task: test:pina:default
            doc_task: ""
            # `default` and `all-features` duplicate what the `test` job
            # already covers on pull requests; they still run on `main`.
            pr_run: false
          - label: no-default
            build_task: build:pina:no-default-only
            test_task: test:pina:no-default
            doc_task: doc:pina:no-default
            pr_run: true
          - label: token-only
            build_task: build:pina:token-only
            test_task: test:pina:token-only
            doc_task: ""
            pr_run: true
          - label: compact-only
            build_task: build:pina:compact-only
            test_task: test:pina:compact-only
            doc_task: doc:pina:compact-only
            pr_run: true
          - label: account-resize-only
            build_task: build:pina:account-resize-only
            test_task: test:pina:account-resize-only
            doc_task: ""
            pr_run: true
          - label: all-features
            build_task: build:pina:all-features
            test_task: test:pina:all-features
            doc_task: ""
            pr_run: false
    name: feature-matrix (${{ matrix.label }})
    steps:
      - name: checkout repository
        if: ${{ github.event_name == 'push' || matrix.pr_run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        if: ${{ github.event_name == 'push' || matrix.pr_run }}
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build `pina` for ${{ matrix.label }}
        if: ${{ github.event_name == 'push' || matrix.pr_run }}
        run: ${{ matrix.build_task }}
        shell: devenv shell -c -- bash -e {0}

      - name: test `pina` for ${{ matrix.label }}
        if: ${{ github.event_name == 'push' || matrix.pr_run }}
        run: ${{ matrix.test_task }}
        shell: devenv shell -c -- bash -e {0}

      - name: build `pina` docs for ${{ matrix.label }}
        if: ${{ (github.event_name == 'push' || matrix.pr_run) && matrix.doc_task != '' }}
        run: ${{ matrix.doc_task }}
        shell: devenv shell -c -- bash -e {0}

  # The SBF example programs are exercised on pull requests by the surfpool
  # workflow; the mollusk/LiteSVM/Quasar tier runs after merge on `main`.
  # Label a pull request `ci-full` to run it before merging.
  program-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run program e2e tests
        run: test:program-e2e
        shell: devenv shell -c -- bash -e {0}

  idl:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.idl == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: verify codama generation
        run: test:idl
        shell: devenv shell -c -- bash -e {0}

      - name: show codama diff on failure
        if: failure()
        run: |
          git --no-pager status --short -- codama/idls codama/clients/rust codama/clients/js codama/clients/cli
          echo
          git --no-pager diff --stat -- codama/idls codama/clients/rust codama/clients/js codama/clients/cli
          echo
          git --no-pager diff -- codama/idls codama/clients/rust codama/clients/js codama/clients/cli
        shell: bash

  # The workspace build is fully covered on pull requests by the `test` and
  # `lint` jobs, which compile every crate; this dedicated build-only pass
  # runs after merge on `main`. Label a pull request `ci-full` to run it
  # before merging.
  build:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build workspace default features
        run: build:default
        shell: devenv shell -c -- bash -e {0}

      - name: build workspace all features
        run: build:all
        shell: devenv shell -c -- bash -e {0}

  release-publish:
    name: release-publish
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && (needs.changes.outputs.changesets == 'true' || contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure local release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: inspect release state
        id: release_state
        run: |
          set -euo pipefail

          current_release=false
          release_record="$RUNNER_TEMP/release-record.json"
          if monochange step release-record \
            --from HEAD \
            --format json \
            > "$release_record" 2>/dev/null; then
            resolved_commit="$(jq -r '.resolved_commit // ""' "$release_record")"
            record_commit="$(jq -r '.record_commit // ""' "$release_record")"
            release_target_count="$(jq '.record.release_targets | length' "$release_record")"

            if [[ "$resolved_commit" == "$record_commit" ]] &&
              ((release_target_count > 0)); then
              current_release=true
            fi
          fi

          has_changesets=false
          if [ -d .changeset ] && find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            has_changesets=true
          fi

          echo "current_release=${current_release}" >> "$GITHUB_OUTPUT"
          echo "has_changesets=${has_changesets}" >> "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: create local release commit
        id: release_commit
        if: steps.release_state.outputs.current_release != 'true' && steps.release_state.outputs.has_changesets == 'true'
        run: |
          set -euo pipefail

          before="$(git rev-parse HEAD)"
          output="$RUNNER_TEMP/release-output.txt"

          # This runs the production release preparation and commit steps but
          # disables the final source-provider write. The generated commit and
          # embedded release record remain local to this disposable runner.
          if ! monochange run release --create-pr=false > "$output" 2>&1; then
            if grep -q 'no releaseable packages were found in discovered changesets' "$output"; then
              echo "No releaseable packages were found; skipping the publish dry-run."
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            cat "$output" >&2
            exit 1
          fi
          cat "$output"

          after="$(git rev-parse HEAD)"
          if [[ "$before" == "$after" ]]; then
            echo "No release commit was created; skipping the publish dry-run."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          monochange step release-record \
            --from HEAD \
            --format json \
            --jq '.resolved_commit == .record_commit' | grep -qx true
          echo "created=true" >> "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: check registry publication readiness
        if: steps.release_state.outputs.current_release == 'true' || steps.release_commit.outputs.created == 'true'
        run: |
          set -euo pipefail

          # Readiness covers the complete release record and identifies packages
          # that still need a first-time placeholder before OIDC can be configured.
          result="$RUNNER_TEMP/publish-readiness.json"
          monochange step publish-readiness \
            --from HEAD \
            --output "$result" \
            --format json
          jq -e '
            .status == "ready" and
              (.packages | length > 0) and
              all(.packages[]; .status == "ready")
          ' "$result" >/dev/null
        shell: devenv shell -- bash -e {0}

      - name: dry-run release publication
        if: steps.release_state.outputs.current_release == 'true' || steps.release_commit.outputs.created == 'true'
        run: |
          set -euo pipefail

          # Select from the generated release record instead of maintaining a
          # package allowlist that could silently omit a newly added package.
          report="$RUNNER_TEMP/publish-dry-run.json"
          monochange step publish-packages \
            --dry-run \
            --all \
            --format json | tee "$report"

          # Readiness and the publish dry-run must cover the same package set.
          # Monochange handles same-release dependency ordering during the real
          # publish after Cargo dry-run reports unavailable future versions.
          jq -s -e '
            (.[0].packages | map(.package) | sort) ==
              (.[1].package_publish.packages | map(.package) | sort) and
              ([.[1].package_publish.summary.planned,
                .[1].package_publish.summary.published,
                .[1].package_publish.summary.already_exists,
                .[1].package_publish.summary.blocked,
                .[1].package_publish.summary.failed,
                .[1].package_publish.summary.not_attempted] | add) > 0 and
              .[1].package_publish.summary.failed == 0
          ' "$RUNNER_TEMP/publish-readiness.json" "$report" >/dev/null
        shell: devenv shell -- bash -e {0}

      - name: skip publish dry-run without a release
        if: steps.release_state.outputs.current_release != 'true' && steps.release_commit.outputs.created != 'true'
        run: echo "This pull request does not produce a publishable release."
