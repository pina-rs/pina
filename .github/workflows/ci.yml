name: "ci"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pull requests run a fast, high-confidence subset: every job is gated on the
# paths that can actually affect it, and the deepest verification tiers
# (kani compact proofs, program e2e, dedicated build) are deferred to the
# post-merge run on `main`. Pushes to `main` always run everything, so the
# full suite still executes once per merged change.
#
# Path gating uses job-level conditions instead of workflow-level `paths:`
# filters because every job here is a required status check: a skipped job
# reports "Skipped", which branch protection treats as success, while a
# workflow that never runs leaves the check in "Expected" and blocks merging.
#
# Add the `ci-full` label to a pull request to run every tier, including the
# main-only jobs, before merging.
jobs:
  changes:
    name: detect changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # Pushes to `main` run every job regardless of paths, so the detection
    # job (and its failure modes) only exists on pull requests.
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      core: ${{ steps.filter.outputs.core_any_changed }}
      cli: ${{ steps.filter.outputs.cli_any_changed }}
      rust: ${{ steps.filter.outputs.rust_any_changed }}
      js: ${{ steps.filter.outputs.js_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      idl: ${{ steps.filter.outputs.idl_any_changed }}
      pina_test: ${{ steps.filter.outputs.pina_test_any_changed }}
      fuzz: ${{ steps.filter.outputs.fuzz_any_changed }}
      changesets: ${{ steps.filter.outputs.changesets_any_changed }}
      toolchain: ${{ steps.filter.outputs.toolchain_any_changed }}
      workflows: ${{ steps.filter.outputs.workflows_any_changed }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify changed paths
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            core:
              - crates/pina/**
              - crates/pina_macros/**
              - crates/pina_abi/**
            cli:
              - crates/pina_cli/**
              - crates/pina_abi/**
              - crates/pina_cli_renderer/**
              - crates/pina_codama_renderer/**
              - crates/pina_cpi_renderer/**
              - crates/pina_profile/**
            rust:
              - crates/**
              - examples/**
              # The root package (`pina_root`) is the workspace root itself, so
              # its sources sit here rather than under a `pina_root/` directory.
              - src/**
              - tests/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
            js:
              - codama/**
              - scripts/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
              - tsconfig.scripts.json
            docs:
              - docs/**
              - template.t.md
              - api-docs.t.md
              - readme.md
            idl:
              - codama/**
              - examples/**
              - crates/pina_macros/**
              - crates/pina_codama_renderer/**
              - crates/pina_cpi_renderer/**
              - crates/pina_cli_renderer/**
              - scripts/generate-pina-clients.sh
              - scripts/verify-pina-clients.sh
              - pnpm-lock.yaml
            pina_test:
              - crates/pina_test/**
            fuzz:
              - crates/pina_fuzz/**
            changesets:
              - .changeset/**
            toolchain:
              - rust-toolchain.toml
              - devenv.nix
              - devenv.lock
              - devenv.yaml
              - .github/actions/**
              - scripts/ci-tasks.ts
            workflows:
              - .github/**

  lint:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    # The status functions are required: without one, a skipped `changes`
    # dependency (pushes to `main`) would skip this job too.
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust (format-only)
        if: ${{ !(github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt
          cache-key: none
          use-mold: "false"
          use-sccache: "false"

      - name: setup Rust (clippy and docs)
        if: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt,clippy,rustc-dev,llvm-tools
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: install lint and formatting tools
        uses: $/.github/actions/install-tools
        with:
          tools: dprint@0.64.1,shfmt@3.14.1,mdbook@0.5.4
          mdt: "true"
          monochange: "true"
          nixfmt: "true"

      - name: setup pnpm
        if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        if: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Formatting and doc-block sync apply to every file type, so they run on
      # every pull request. The heavy compilers only run when the change can
      # affect them.
      - name: lint format
        run: dprint check
        shell: bash

      - name: check synced docs blocks
        run: mdt check --path .
        shell: bash

      - name: lint monochange
        run: monochange check
        shell: bash

      - name: lint rust
        if: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: node scripts/ci-tasks.ts lint:clippy
        shell: bash

      - name: verify docs
        if: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: node scripts/ci-tasks.ts verify:docs
        shell: bash

      - name: install js dependencies
        if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: bash

      - name: type-check scripts and js clients
        if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          pnpm run check:scripts
          pnpm run check:js
        shell: bash

  security:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustc-dev,llvm-tools
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: install cargo-audit
        uses: $/.github/actions/install-tools
        with:
          tools: cargo-audit@0.22.2

      - name: run Pina security lints
        run: node scripts/ci-tasks.ts security:pina-lint
        shell: bash

      - name: audit Rust dependencies
        run: node scripts/ci-tasks.ts security:audit
        shell: bash

      - name: audit npm dependencies
        run: pnpm audit
        shell: bash

  cargo-deny:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: install cargo-deny
        uses: $/.github/actions/install-tools
        with:
          tools: cargo-deny@0.20.2

      - name: check dependency policy
        env:
          # cargo-deny only invokes `cargo metadata`; use the runner's
          # preinstalled stable toolchain instead of downloading nightly.
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-tasks.ts security:deny
        shell: bash

  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.workflows == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: install zizmor
        uses: $/.github/actions/install-tools
        with:
          tools: zizmor@1.31.1

      - name: audit GitHub Actions
        run: zizmor --no-online-audits --no-progress .github
        shell: bash

      - name: test privileged workflow provenance
        run: node --test .github/tests/workflow-provenance.test.ts
        shell: bash

  test:
    # `test:all` sweeps every workspace member, so allow the same headroom as
    # the `program-e2e` job.
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: changes
    # `coverage` runs this same suite on pull requests under a profiling build,
    # so running it here too would duplicate work for no extra signal. Pushes
    # to `main` and the `ci-full` label still run it, which keeps a second,
    # non-instrumented execution of the suite.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustc-dev,llvm-tools
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install cargo-expand
        uses: $/.github/actions/install-tools
        with:
          cargo-expand: "true"

      - name: run tests
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          node scripts/ci-tasks.ts test:all
        shell: bash

  windows-cli:
    name: windows CLI
    timeout-minutes: 20
    runs-on: windows-latest
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-02-20

      - name: cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: test CLI portability
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked --all-features -p pina_cli

  pina-test:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.pina_test == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: clippy
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: verify isolated Surfpool test support
        run: node scripts/ci-tasks.ts verify:pina-test
        shell: bash

  fuzz:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.fuzz == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: fuzz
          workspaces: "crates/pina_fuzz/fuzz -> target"
          use-mold: "false"
          use-sccache: "false"

      - name: install cargo-fuzz
        uses: $/.github/actions/install-tools
        with:
          cargo-fuzz: "true"

      - name: replay corpus and fuzz for a bounded duration
        run: bash scripts/run-fuzz-smoke.sh
        shell: bash

      - name: upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: crates/pina_fuzz/fuzz/artifacts
          if-no-files-found: ignore

  miri:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust with Miri
        uses: $/.github/actions/setup-rust
        with:
          toolchain: nightly-2026-02-20
          components: rust-src,miri
          cache-key: miri
          use-mold: "false"
          use-sccache: "false"

      - name: run miri zero-copy regressions
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-symbolic-alignment-check"
        run: |
          set -euo pipefail
          cargo miri setup
          cargo miri test --locked -p pina --test miri_loader_guards --all-features
          cargo miri test --locked -p pina --test schema_boundary --all-features
          # The entrypoint deserializes the loader's raw input through `unsafe`;
          # its tests build that input byte for byte.
          cargo miri test --locked -p pina --lib --all-features entry::
          # `dispatch_entrypoint!` programs walk that input from generated code.
          cargo miri test --locked -p pina --test dispatch_entrypoint --all-features
        shell: bash

  kani-quick:
    name: kani (quick)
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    # The Kani version and the harness filter live in this workflow file, so a
    # change to either has to re-run the proofs.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || needs.changes.outputs.workflows == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run fast kani proofs
        # The flags mirror the `test:kani:quick` devenv task; change both
        # together. `cargo-kani` is invoked as a binary rather than through
        # `cargo kani`, because `.cargo/config.toml` aliases `kani` to
        # cargo-run-bin, which has no `cargo-kani` entry and fails the alias.
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: 0.68.0
          command: cargo-kani -p pina --lib --no-default-features --features account-resize,compact --output-format terse --harness quick_

  # The bounded state-machine proofs are the slowest verification tier, so
  # they only run after merge on `main`. Label a pull request `ci-full` to
  # run them before merging.
  kani-compact:
    name: kani (compact layouts)
    timeout-minutes: 50
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run compact-layout kani proofs
        # Mirrors the `test:kani:compact` devenv task; change both together.
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: 0.68.0
          command: cargo-kani -p pina --lib --no-default-features --features compact --output-format terse --harness compact_

  feature-matrix:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: changes
    # The job itself must always run so the matrix expands: required status
    # checks are per matrix leg, and a job skipped before expansion reports a
    # single literal `feature-matrix (${{ matrix.label }})` check that never
    # satisfies branch protection. The per-step conditions skip the legs.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            check_args: "-p pina --locked"
            test_args: "-p pina --lib --locked"
            extra_test_args: ""
            doc_args: ""
            # `default` and `all-features` duplicate what the `coverage`/`test`
            # jobs already cover on pull requests; they still run on `main`.
            pr_run: false
          - label: no-default
            check_args: "-p pina --no-default-features --locked"
            test_args: "-p pina --no-default-features --lib --locked"
            extra_test_args: ""
            doc_args: "-p pina --no-default-features --no-deps --locked"
            pr_run: true
          - label: token-only
            check_args: "-p pina --no-default-features --features token --locked"
            test_args: "-p pina --no-default-features --features token --lib --locked"
            extra_test_args: ""
            doc_args: ""
            pr_run: true
          - label: compact-only
            check_args: "-p pina --no-default-features --features compact --locked"
            test_args: "-p pina --no-default-features --features compact --lib --test compact_account --test cpi_ui --locked"
            extra_test_args: ""
            doc_args: "-p pina --no-default-features --features compact --no-deps --locked"
            pr_run: true
          - label: floats-only
            check_args: "-p pina --no-default-features --features floats --locked"
            test_args: "-p pina --no-default-features --features floats --lib --test floats --locked"
            extra_test_args: ""
            doc_args: ""
            pr_run: true
          - label: fixed-only
            check_args: "-p pina --no-default-features --features fixed --locked"
            test_args: "-p pina --no-default-features --features fixed --lib --test fixed --locked"
            extra_test_args: ""
            doc_args: ""
            pr_run: true
          - label: account-resize-only
            check_args: "-p pina --no-default-features --features account-resize --locked"
            test_args: "-p pina --no-default-features --features account-resize,derive --lib --test cpi_helpers --locked"
            extra_test_args: "-p pina_macros --no-default-features --lib --locked"
            doc_args: ""
            pr_run: true
          - label: all-features
            check_args: "-p pina --all-features --locked"
            test_args: "-p pina --all-features --lib --locked"
            extra_test_args: ""
            doc_args: ""
            pr_run: false
    name: feature-matrix (${{ matrix.label }})
    steps:
      - name: checkout repository
        if: ${{ github.event_name == 'push' || ((matrix.pr_run || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        if: ${{ github.event_name == 'push' || ((matrix.pr_run || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
        uses: $/.github/actions/setup-rust
        with:
          cache-key: feature-matrix
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: build `pina` for ${{ matrix.label }}
        if: ${{ github.event_name == 'push' || ((matrix.pr_run || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
        env:
          CHECK_ARGS: ${{ matrix.check_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cargo check $CHECK_ARGS
        shell: bash

      - name: test `pina` for ${{ matrix.label }}
        if: ${{ github.event_name == 'push' || ((matrix.pr_run || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
        env:
          TEST_ARGS: ${{ matrix.test_args }}
          EXTRA_TEST_ARGS: ${{ matrix.extra_test_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cargo test $TEST_ARGS
          if [[ -n "$EXTRA_TEST_ARGS" ]]; then
            # shellcheck disable=SC2086
            cargo test $EXTRA_TEST_ARGS
          fi
        shell: bash

      - name: build `pina` docs for ${{ matrix.label }}
        if: ${{ (github.event_name == 'push' || ((matrix.pr_run || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (needs.changes.outputs.core == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')))) && matrix.doc_args != '' }}
        env:
          DOC_ARGS: ${{ matrix.doc_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cargo doc $DOC_ARGS
        shell: bash

  # The SBF example programs are exercised on pull requests by the surfpool
  # workflow; the mollusk/LiteSVM/Quasar tier runs after merge on `main`.
  # Label a pull request `ci-full` to run it before merging.
  program-e2e:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: setup SBF toolchain
        uses: $/.github/actions/setup-sbf

      - name: run program e2e tests
        run: node scripts/ci-tasks.ts test:program-e2e
        shell: bash

  idl:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.idl == 'true' || needs.changes.outputs.toolchain == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt
          extra-toolchain: nightly-2025-11-20
          extra-components: rust-src
          cache-key: idl
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: setup Dart SDK
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.13.0"

      - name: cache Dart pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('codama/clients/dart/pubspec.lock', 'codama/clients/cli/dart/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: install dprint and shfmt
        uses: $/.github/actions/install-tools
        with:
          tools: dprint@0.64.1,shfmt@3.14.1

      - name: verify generated clients
        run: bash scripts/verify-pina-clients.sh
        shell: bash

      - name: show generated client diff on failure
        if: failure()
        run: |
          git --no-pager status --short -- codama/
          echo
          git --no-pager diff --stat -- codama/
          echo
          git --no-pager diff -- codama/
        shell: bash

  # The workspace build is fully covered on pull requests by the `coverage` and
  # `lint` jobs, which compile every crate; this dedicated build-only pass
  # runs after merge on `main`. Label a pull request `ci-full` to run it
  # before merging.
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustc-dev,llvm-tools
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: build workspace default features
        run: cargo build --locked
        shell: bash

      - name: build workspace all features
        run: cargo build --all-features --locked
        shell: bash

  release-publish:
    name: release-publish
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && (needs.changes.outputs.changesets == 'true' || contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    permissions:
      contents: read
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    needs: changes
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt,rustc-dev,llvm-tools
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install release and formatting tools
        uses: $/.github/actions/install-tools
        with:
          tools: dprint@0.64.1,shfmt@3.14.1
          mdt: "true"
          monochange: "true"
          nixfmt: "true"

      - name: configure local release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: inspect release state
        id: release_state
        run: |
          set -euo pipefail

          current_release=false
          release_record="$RUNNER_TEMP/release-record.json"
          if monochange step release-record \
            --from HEAD \
            --format json \
            > "$release_record" 2>/dev/null; then
            resolved_commit="$(jq -r '.resolved_commit // ""' "$release_record")"
            record_commit="$(jq -r '.record_commit // ""' "$release_record")"
            release_target_count="$(jq '.record.release_targets | length' "$release_record")"

            if [[ "$resolved_commit" == "$record_commit" ]] &&
              ((release_target_count > 0)); then
              current_release=true
            fi
          fi

          has_changesets=false
          if [ -d .changeset ] && find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            has_changesets=true
          fi

          echo "current_release=${current_release}" >> "$GITHUB_OUTPUT"
          echo "has_changesets=${has_changesets}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: create local release commit
        id: release_commit
        if: steps.release_state.outputs.current_release != 'true' && steps.release_state.outputs.has_changesets == 'true'
        run: |
          set -euo pipefail

          before="$(git rev-parse HEAD)"
          output="$RUNNER_TEMP/release-output.txt"

          # This runs the production release preparation and commit steps but
          # disables the final source-provider write. The generated commit and
          # embedded release record remain local to this disposable runner.
          if ! monochange run release --create-pr=false > "$output" 2>&1; then
            if grep -q 'no releaseable packages were found in discovered changesets' "$output"; then
              echo "No releaseable packages were found; skipping the publish dry-run."
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            cat "$output" >&2
            exit 1
          fi
          cat "$output"

          after="$(git rev-parse HEAD)"
          if [[ "$before" == "$after" ]]; then
            echo "No release commit was created; skipping the publish dry-run."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          monochange step release-record \
            --from HEAD \
            --format json \
            --jq '.resolved_commit == .record_commit' | grep -qx true
          echo "created=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: check registry publication readiness
        if: steps.release_state.outputs.current_release == 'true' || steps.release_commit.outputs.created == 'true'
        run: |
          set -euo pipefail

          # Readiness covers the complete release record and identifies packages
          # that still need a first-time placeholder before OIDC can be configured.
          result="$RUNNER_TEMP/publish-readiness.json"
          monochange step publish-readiness \
            --from HEAD \
            --output "$result" \
            --format json
          jq -e '
            .status == "ready" and
              (.packages | length > 0) and
              all(.packages[]; .status == "ready")
          ' "$result" >/dev/null
        shell: bash

      - name: dry-run release publication
        if: steps.release_state.outputs.current_release == 'true' || steps.release_commit.outputs.created == 'true'
        run: |
          set -euo pipefail

          # Select from the generated release record instead of maintaining a
          # package allowlist that could silently omit a newly added package.
          report="$RUNNER_TEMP/publish-dry-run.json"
          monochange step publish-packages \
            --dry-run \
            --all \
            --format json | tee "$report"

          # Readiness and the publish dry-run must cover the same package set.
          # Monochange handles same-release dependency ordering during the real
          # publish after Cargo dry-run reports unavailable future versions.
          # A package already at its released version (pina_abi rides its own
          # release line, so it is `skipped_existing` in every `--all` dry run
          # once published) has nothing to publish, and the readiness step
          # omits exactly those, so drop the no-op entries before comparing.
          jq -s -e '
            (.[0].packages | map(.package) | sort) ==
              (.[1].package_publish.packages
                | map(select(.status != "skipped_existing"))
                | map(.package)
                | sort) and
              ([.[1].package_publish.summary.planned,
                .[1].package_publish.summary.published,
                .[1].package_publish.summary.already_exists,
                .[1].package_publish.summary.blocked,
                .[1].package_publish.summary.failed,
                .[1].package_publish.summary.not_attempted] | add) > 0 and
              .[1].package_publish.summary.failed == 0
          ' "$RUNNER_TEMP/publish-readiness.json" "$report" >/dev/null
        shell: bash

      - name: skip publish dry-run without a release
        if: steps.release_state.outputs.current_release != 'true' && steps.release_commit.outputs.created != 'true'
        run: echo "This pull request does not produce a publishable release."
        shell: bash
