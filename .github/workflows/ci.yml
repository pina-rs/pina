name: "ci"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint all
        run: lint:all
        shell: devenv shell -c -- bash -e {0}

  security:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: verify security
        run: verify:security
        shell: devenv shell -c -- bash -e {0}

  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run tests
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          test:all
        shell: devenv shell -- bash -e {0}

  windows-cli:
    name: windows CLI
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-02-20

      - name: test CLI portability
        run: cargo test --locked --all-features -p pina_cli

  pina-test:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: verify isolated Surfpool test support
        run: verify:pina-test
        shell: devenv shell -c -- bash -e {0}

  fuzz:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: replay corpus and fuzz for a bounded duration
        run: test:fuzz:smoke
        shell: devenv shell -c -- bash -e {0}

      - name: upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: crates/pina_fuzz/fuzz/artifacts
          if-no-files-found: ignore

  miri:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run miri zero-copy regressions
        run: test:miri
        shell: devenv shell -c -- bash -e {0}

  feature-matrix:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            build_task: build:pina:default
            test_task: test:pina:default
            doc_task: ""
          - label: no-default
            build_task: build:pina:no-default-only
            test_task: test:pina:no-default
            doc_task: doc:pina:no-default
          - label: token-only
            build_task: build:pina:token-only
            test_task: test:pina:token-only
            doc_task: ""
          - label: all-features
            build_task: build:pina:all-features
            test_task: test:pina:all-features
            doc_task: ""
    name: feature-matrix (${{ matrix.label }})
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build `pina` for ${{ matrix.label }}
        run: ${{ matrix.build_task }}
        shell: devenv shell -c -- bash -e {0}

      - name: test `pina` for ${{ matrix.label }}
        run: ${{ matrix.test_task }}
        shell: devenv shell -c -- bash -e {0}

      - name: build `pina` docs for ${{ matrix.label }}
        if: ${{ matrix.doc_task != '' }}
        run: ${{ matrix.doc_task }}
        shell: devenv shell -c -- bash -e {0}

  program-e2e:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run program e2e tests
        run: test:program-e2e
        shell: devenv shell -c -- bash -e {0}

  idl:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: verify codama generation
        run: test:idl
        shell: devenv shell -c -- bash -e {0}

      - name: show codama diff on failure
        if: failure()
        run: |
          git --no-pager status --short -- codama/idls codama/clients/rust codama/clients/js
          echo
          git --no-pager diff --stat -- codama/idls codama/clients/rust codama/clients/js
          echo
          git --no-pager diff -- codama/idls codama/clients/rust codama/clients/js
        shell: bash

  build:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build workspace default features
        run: build:default
        shell: devenv shell -c -- bash -e {0}

      - name: build workspace all features
        run: build:all
        shell: devenv shell -c -- bash -e {0}
