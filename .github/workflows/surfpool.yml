name: "surfpool"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The Surfpool suite builds and validates every SBF example, so it only has
# signal when example programs or the crates they are built from change.
# Pull requests that touch nothing it exercises skip the job; pushes to
# `main` always run it. Label a pull request `ci-full` to force a run.
jobs:
  changes:
    name: detect changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # Pushes to `main` and manual dispatches run the suite regardless of
    # paths, so the detection job only exists on pull requests.
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      relevant: ${{ steps.filter.outputs.relevant_any_changed }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify changed paths
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            relevant:
              - examples/**
              - crates/**
              - codama/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - devenv.nix
              - devenv.lock
              - devenv.yaml
              - scripts/build-surfpool-examples.sh
              - .github/workflows/surfpool.yml
              - .github/actions/**
              - scripts/ci-tasks.ts

  surfpool-examples:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install surfpool CLI
        uses: $/.github/actions/install-tools
        with:
          surfpool: "true"

      - name: setup SBF toolchain
        uses: $/.github/actions/setup-sbf

      - name: build and test all Surfpool examples
        run: node scripts/ci-tasks.ts test:surfpool
        shell: bash
