name: publish
run-name: "publish ${{ inputs.tag || github.ref_name }} @ ${{ inputs.checkout_ref || github.sha }} (dry-run=${{ inputs.dry_run == true }})"

# Single workflow that builds release artifacts, publishes packages, and
# publishes the GitHub release. release-pr.yml explicitly dispatches it after
# creating the tag and draft release because a GITHUB_TOKEN tag push cannot
# trigger another workflow. The tag trigger remains as a fallback for tags
# created with credentials that are not subject to GitHub's recursion guard.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.8.0). Used by the automated release handoff and manual retries."
        required: true
        type: string
      dry_run:
        description: "Simulate the publish: build every artifact and validate the release, but publish nothing and keep the release a draft."
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: "Commit SHA to build. Release automation passes an immutable SHA, including for unmerged read-only previews. Real publishing also requires the tag to match and the commit to be merged into protected main. Dispatch this workflow from main."
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "abi/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

# On a tag push github.ref_name is the tag (e.g. v0.9.0); on a manual
# workflow_dispatch retry inputs.tag is the tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_ASSET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  authorize:
    uses: $/.github/workflows/authorize-main.yml

  # Resolve the release to exactly one commit before anything is checked out.
  # `checkout_ref` exists so a dry run can validate the release commit before
  # the tag exists; left unconstrained it would also let a manual retry build
  # from an arbitrary ref, and the assets this workflow uploads are the ones
  # users install. Every downstream job takes its `ref:` and `sha:` from here
  # instead of re-deriving a symbolic ref.
  resolve_revision:
    needs: authorize
    name: resolve release revision
    if: >-
      github.repository_owner == 'pina-rs' &&
      (startsWith(inputs.tag || github.ref_name, 'v') || startsWith(inputs.tag || github.ref_name, 'abi/v'))
    permissions:
      contents: read # Resolve the tag and the requested ref to commit SHAs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: resolve tag and checkout ref to one commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_REF: ${{ inputs.checkout_ref }}
          APPROVED_MAIN_SHA: ${{ needs.authorize.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Resolve a ref to a commit SHA. `gh api` exits non-zero on an
          # unknown ref but still prints an error body to stdout, so the exit
          # status — not the output — decides success. Callers must be able to
          # tell "no such ref" from "resolved", and a swallowed status would
          # turn an error body into a bogus SHA.
          resolve_sha() {
            local ref="$1" payload
            if ! payload="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" 2>/dev/null)"; then
              return 1
            fi
            printf '%s' "$payload" | jq -r '.sha'
          }

          requested="${REQUESTED_REF:-$RELEASE_TAG}"

          # A pre-tag dry run legitimately has no tag yet. Every other path
          # must resolve one, so a missing tag cannot silently widen the ref
          # this workflow accepts.
          #
          # The tag is resolved through its fully-qualified `refs/tags/` name.
          # A bare name would also match a branch that happens to share the
          # tag's name, so a branch created alongside a release tag could
          # satisfy the equality check below while the real tag pointed
          # somewhere else.
          tag_sha=""
          if candidate="$(resolve_sha "refs/tags/$RELEASE_TAG")"; then
            tag_sha="$candidate"
          elif [[ "$DRY_RUN" != "true" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not resolve to a commit." >&2
            exit 1
          fi

          if ! resolved_sha="$(resolve_sha "$requested")"; then
            echo "::error::Checkout ref '$requested' does not resolve to a commit." >&2
            exit 1
          fi

          # The published revision must be the tagged one. A mismatch means
          # the tag and the requested ref disagree about what is being
          # released, so stop rather than build the wrong tree.
          if [[ -n "$tag_sha" && "$tag_sha" != "$resolved_sha" ]]; then
            echo "::error::$RELEASE_TAG is at $tag_sha but '$requested' is at $resolved_sha; refusing to build a revision the tag does not point at." >&2
            exit 1
          fi

          if [[ ! "$resolved_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout ref did not resolve to a full commit SHA." >&2
            exit 1
          fi

          # Only read-only previews may build unmerged code. Every job with
          # release credentials must build a commit already on protected main.
          if [[ "$DRY_RUN" != true ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$resolved_sha...$APPROVED_MAIN_SHA" --jq '.status')"
            if [[ "$status" != identical && "$status" != ahead ]]; then
              echo "::error::Release commit has not been merged into protected main." >&2
              exit 1
            fi
          fi

          if [[ -z "$tag_sha" ]]; then
            echo "Release tag '$RELEASE_TAG' does not exist yet; pinning this dry run to $resolved_sha."
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG from $resolved_sha"

  preview_assets:
    needs: resolve_revision
    if: inputs.dry_run == true && startsWith(inputs.tag, 'v')
    # Unmerged previews must not write caches in main's scope.
    cache-mode: read
    permissions:
      contents: read
    uses: $/.github/workflows/build-release.yml
    with:
      sha: ${{ needs.resolve_revision.outputs.sha }}
      tag: ${{ inputs.tag }}
      dry_run: true

  upload_assets:
    needs: resolve_revision
    if: inputs.dry_run != true && startsWith(inputs.tag || github.ref_name, 'v')
    permissions:
      contents: write # Upload assets only after the commit is approved.
    uses: $/.github/workflows/build-release.yml
    with:
      sha: ${{ needs.resolve_revision.outputs.sha }}
      tag: ${{ inputs.tag || github.ref_name }}
      dry_run: false

  attest_assets:
    name: attest release assets
    # Require every direct asset-producing dependency to succeed before the
    # release archives are attested.
    # Nothing was uploaded in a dry run, so there is nothing to attest.
    if: >-
      needs.resolve_revision.result == 'success' &&
      needs.upload_assets.result == 'success' &&
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v') &&
      (inputs.dry_run != true)
    needs:
      - resolve_revision
      - upload_assets
    # Read release archives, then attach OIDC-backed provenance attestations.
    permissions:
      attestations: write # Record provenance for every release asset.
      contents: write # Download assets from the draft release for verification.
      id-token: write # Exchange GitHub's OIDC identity for an attestation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_revision.outputs.sha }}
          persist-credentials: false
      - name: download all release archives for attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"

          # This gate runs only after every CLI matrix job succeeds.
          # Download the draft release as the source of truth so attestation
          # covers exactly the artifacts users will receive, not job-local files.
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pina-*' \
            --dir "$asset_dir"
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "$asset_dir"/*
      - name: attest all release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*
      - name: verify all release archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  publish:
    name: publish packages and release
    needs:
      - resolve_revision
      - attest_assets
    # Repository setting this job depends on: the `publisher` environment MUST
    # require reviewers for every deployment. That protection rule is the only
    # thing standing between a workflow_dispatch retry and a registry publish,
    # because this job holds `id-token: write` and exchanges it for crates.io
    # and npm trusted-publishing credentials. The rule lives in repository
    # settings rather than in this file, so it cannot be reviewed here: keep it
    # configured, and treat its removal as a security regression rather than a
    # CI configuration change.
    environment: publisher
    # Use OIDC for registry publishing, then publish the draft GitHub release.
    permissions:
      contents: write # Publish the draft GitHub release after registry publication.
      id-token: write # Authenticate to crates.io and npm trusted publishing.
    # Never publish unless every release asset was attested successfully.
    # A dry run stops here: assets are built and attested against the draft
    # release but no registry publish happens and the release stays draft.
    if: >-
      needs.resolve_revision.result == 'success' &&
      needs.attest_assets.result == 'success' &&
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v') &&
      (inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: validate release tag input
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* && "$RELEASE_TAG" != abi/v* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a release tag like v0.9.0 or abi/v0.20.0" >&2
            exit 1
          fi
        shell: bash
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_revision.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc
      - name: setup cargo stable for publish
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: setup node for publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Use the Node/npm pair from devenv. npm discovers the GitHub OIDC
          # credentials itself; replacing it with a prefixed npm can bypass
          # trusted publishing and fail with ENEEDAUTH.
          node-version: 24
          package-manager-cache: false
      - name: prepare npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # --ignore-scripts matches PR CI. This job runs with `id-token:
          # write` in the publisher environment, so a dependency lifecycle
          # script would execute with credentials that can publish to the
          # registries. Any dependency that genuinely needs an install script
          # must be reviewed explicitly before it is allowed to run here --
          # do not drop this flag to make a build pass. The build tools this
          # step invokes (esbuild via tsup) ship their platform binary as an
          # optional dependency and need no install script.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:codama-nodes
          pnpm run build:codama-renderer-cpi
          # `pina generate` resolves this package from npm for the TypeScript
          # and Dart CLI clients, so a tarball without `dist/` breaks every
          # project outside this repository.
          pnpm run build:codama-renderer-cli
          pnpm run check:npm-packages
          pnpm run test:npm-packages

          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pina-*-${RELEASE_TAG}.tar.gz" \
            --pattern "pina-*-${RELEASE_TAG}.zip" \
            --dir "$assets_dir"
          node scripts/npm/package-cli.mjs \
            --release-tag "$RELEASE_TAG" \
            --assets-dir "$assets_dir"

          pack_report="$RUNNER_TEMP/pina-codama-nodes-pack.json"
          npm pack ./packages/nodes-from-pina --dry-run --json > "$pack_report"
          for required_file in \
            dist/index.js \
            dist/index.mjs \
            dist/types/index.d.ts; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$pack_report" >/dev/null || {
                echo "::error::npm package is missing $required_file" >&2
                exit 1
              }
          done

          cpi_pack_report="$RUNNER_TEMP/pina-codama-renderer-cpi-pack.json"
          npm pack ./packages/codama-renderer-cpi --dry-run --json > "$cpi_pack_report"
          for required_file in dist/index.js dist/types/index.d.ts README.md; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$cpi_pack_report" >/dev/null || {
                echo "::error::@pina-rs/codama-renderer-cpi is missing $required_file" >&2
                exit 1
              }
          done

          cli_renderer_pack_report="$RUNNER_TEMP/pina-codama-renderer-cli-pack.json"
          npm pack ./packages/codama-renderer-cli --dry-run --json > "$cli_renderer_pack_report"
          for required_file in dist/index.js dist/types/index.d.ts README.md; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$cli_renderer_pack_report" >/dev/null || {
                echo "::error::@pina-rs/codama-renderer-cli is missing $required_file" >&2
                exit 1
              }
          done

          npm pack ./packages/pina__cli --dry-run --json > "$RUNNER_TEMP/pina-cli-pack.json"
          jq -e 'any(.[0].files[]; .path == "bin/pina.cjs")' \
            "$RUNNER_TEMP/pina-cli-pack.json" >/dev/null

          npm pack ./packages/pina__skill --dry-run --json > "$RUNNER_TEMP/pina-skill-pack.json"
          for required_file in SKILL.md agents/openai.yaml references/program-authoring.md bin/pina-skill.cjs; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$RUNNER_TEMP/pina-skill-pack.json" >/dev/null || {
                echo "::error::@pina-rs/skill is missing $required_file" >&2
                exit 1
              }
          done

          for package_dir in packages/pina__cli-*; do
            package_name="$(jq -r .name "$package_dir/package.json")"
            binary_name=pina
            case "$package_name" in
              *-win32-*) binary_name=pina.exe ;;
            esac
            platform_report="$RUNNER_TEMP/$(basename "$package_dir")-pack.json"
            npm pack "./$package_dir" --dry-run --json > "$platform_report"
            jq -e --arg path "bin/$binary_name" \
              'any(.[0].files[]; .path == $path)' \
              "$platform_report" >/dev/null || {
                echo "::error::$package_name is missing bin/$binary_name" >&2
                exit 1
              }
          done
        shell: devenv shell -- bash -e {0}
      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          monochange step publish-readiness \
            --from HEAD \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |
          set -euo pipefail
          monochange step publish-packages \
            --log-level info \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
