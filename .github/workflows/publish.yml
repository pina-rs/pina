name: publish

# Single workflow that builds release artifacts, publishes packages, and
# publishes the GitHub release. release-pr.yml explicitly dispatches it after
# creating the tag and draft release because a GITHUB_TOKEN tag push cannot
# trigger another workflow. The tag trigger remains as a fallback for tags
# created with credentials that are not subject to GitHub's recursion guard.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.8.0). Used by the automated release handoff and manual retries."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

# On a tag push github.ref_name is the tag (e.g. v0.9.0); on a manual
# workflow_dispatch retry inputs.tag is the tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_ASSET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare_dylint_tools:
    name: resolve Dylint tool release
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      required: ${{ steps.release.outputs.required }}
      tag: ${{ steps.release.outputs.tag }}
      toolchain: ${{ steps.release.outputs.toolchain }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read # Inspect the versioned Dylint tool release.
    runs-on: ubuntu-24.04
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: check for a complete Dylint tool release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # lints.json is the single release contract shared by this workflow
          # and the CLI downloader. A Dylint version gets one durable tool
          # release that later Pina versions can reuse without rebuilding it.
          version="$(jq -er .dylintVersion crates/pina_cli/lints.json)"
          toolchain="$(jq -er .toolchain crates/pina_cli/lints.json)"
          tag="dylint-v${version}"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "toolchain=$toolchain"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          # Only a genuine 404 means the cache is absent. Treat authentication,
          # rate-limit, and network errors as failures rather than attempting a
          # conflicting rebuild of a release that may already exist.
          release_error="$(mktemp)"
          if release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>"$release_error")"; then
            :
          elif grep -q '(HTTP 404)' "$release_error"; then
            echo "No $tag release exists; native Dylint tools will be built."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::Could not inspect the $tag Dylint tool release." >&2
            cat "$release_error" >&2
            exit 1
          fi

          # A published version-keyed release is immutable. If it is draft or
          # incomplete, fail closed instead of silently mixing old and new
          # native executables under the same Dylint version.
          if [ "$(jq -r .draft <<< "$release")" != false ]; then
            echo "::error::The existing $tag release is still a draft." >&2
            exit 1
          fi

          while IFS= read -r target; do
            asset="pina-dylint-tools-${target}-v${version}.tar.gz"
            jq -e --arg asset "$asset" \
              'any(.assets[]; .name == $asset and ((.digest // "") | startswith("sha256:")))' \
              <<< "$release" >/dev/null || {
                echo "::error::The existing $tag release is missing verified asset $asset." >&2
                exit 1
              }
          done < <(jq -r '.targets[]' crates/pina_cli/lints.json)
          echo "The complete $tag release already exists; no Dylint tools will be rebuilt."
          echo "required=false" >> "$GITHUB_OUTPUT"

  build_dylint_tools:
    name: build Dylint tools ${{ matrix.target }}
    needs: prepare_dylint_tools
    if: needs.prepare_dylint_tools.outputs.required == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: build native Dylint tools
        env:
          DYLINT_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          # The script uses `cargo +stable` explicitly because the checked-in
          # rust-toolchain.toml intentionally selects nightly for lint cdylibs.
          node scripts/lints/build-dylint-tools.mjs \
            --target "$DYLINT_TARGET" \
            --output-dir "$RUNNER_TEMP/dylint-assets"
      - name: upload native Dylint tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dylint-tools-${{ matrix.target }}
          path: ${{ runner.temp }}/dylint-assets/*.tar.gz
          if-no-files-found: error

  build_musl_dylint_tools:
    name: build Dylint tools ${{ matrix.target }}
    needs: prepare_dylint_tools
    if: needs.prepare_dylint_tools.outputs.required == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            rustup-sha256: a97c8f56d7462908695348dd8c71ea6740c138ce303715793a690503a94fc9a9
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            rustup-sha256: e6599a1c7be58a2d8eaca66a80e0dc006d87bbcf780a58b7343d6e14c1605cb2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: build native musl Dylint tools
        env:
          DYLINT_TARGET: ${{ matrix.target }}
          RUSTUP_SHA256: ${{ matrix.rustup-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dylint-assets"

          # GNU-hosted runners cannot produce native musl executables. Build in
          # a digest-pinned Alpine container whose architecture matches the
          # runner, verify rustup before executing it, and mount only the source
          # tree plus the directory that receives the final archive.
          docker run --rm \
            --env DYLINT_TARGET \
            --env RUSTUP_SHA256 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/dylint-assets:/dylint-assets" \
            --workdir /workspace \
            alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1 \
            sh -euc '
              apk add --no-cache bash build-base ca-certificates cmake curl nodejs openssl-dev perl pkgconf
              rustup_url="https://static.rust-lang.org/rustup/archive/1.28.2/$DYLINT_TARGET/rustup-init"
              curl --proto "=https" --tlsv1.2 -sSf "$rustup_url" -o /tmp/rustup-init
              echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c -
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"

              # build-dylint-tools uses +stable explicitly, preventing the
              # repository nightly override from downloading another toolchain.
              node scripts/lints/build-dylint-tools.mjs \
                --target "$DYLINT_TARGET" \
                --output-dir /dylint-assets
            '
      - name: upload native musl Dylint tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dylint-tools-${{ matrix.target }}
          path: ${{ runner.temp }}/dylint-assets/*.tar.gz
          if-no-files-found: error

  build_freebsd_dylint_tools:
    name: build Dylint tools x86_64-unknown-freebsd
    needs: prepare_dylint_tools
    if: needs.prepare_dylint_tools.outputs.required == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: build native FreeBSD Dylint tools
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          usesh: true
          prepare: pkg install -y cmake curl node24 pkgconf
          run: |
            set -euo pipefail

            # FreeBSD must also be built natively. Pin and verify rustup before
            # installing stable, then let the shared script validate that the
            # resulting rustc host matches the archive target.
            rustup_url='https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-freebsd/rustup-init'
            curl --proto '=https' --tlsv1.2 -sSf "$rustup_url" -o /tmp/rustup-init
            test "$(sha256 -q /tmp/rustup-init)" = '4d9fef2e40731489f3186c61a0f178d54d79864fe3d34791edf5b17f70074956'
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            node scripts/lints/build-dylint-tools.mjs \
              --target x86_64-unknown-freebsd \
              --output-dir ./dylint-assets
      - name: upload native FreeBSD Dylint tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dylint-tools-x86_64-unknown-freebsd
          path: dylint-assets/*.tar.gz
          if-no-files-found: error

  publish_dylint_tools:
    name: publish or reuse Dylint tools
    # The three build jobs are expected to be skipped when the versioned tool
    # release already exists. `always()` lets this join job handle both the
    # reuse path and the successful all-platform build path, while the rest of
    # the expression prevents it from running after any real build failure.
    needs:
      - prepare_dylint_tools
      - build_dylint_tools
      - build_musl_dylint_tools
      - build_freebsd_dylint_tools
    if: >-
      always() &&
      needs.prepare_dylint_tools.result == 'success' &&
      (needs.prepare_dylint_tools.outputs.required == 'false' ||
        (needs.build_dylint_tools.result == 'success' &&
          needs.build_musl_dylint_tools.result == 'success' &&
          needs.build_freebsd_dylint_tools.result == 'success'))
    permissions:
      actions: read # Download the matrix-built Dylint archives.
      attestations: write # Record provenance for newly built Dylint archives.
      contents: write # Create or inspect the versioned Dylint release.
      id-token: write # Exchange GitHub's OIDC identity for attestations.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: download newly built Dylint tools
        if: needs.prepare_dylint_tools.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dylint-tools-*
          path: ${{ runner.temp }}/dylint-assets
          merge-multiple: true
      - name: download existing Dylint tools
        if: needs.prepare_dylint_tools.outputs.required == 'false'
        env:
          DYLINT_TAG: ${{ needs.prepare_dylint_tools.outputs.tag }}
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dylint-assets"
          gh release download "$DYLINT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pina-dylint-tools-*-v${DYLINT_VERSION}.tar.gz" \
            --dir "$RUNNER_TEMP/dylint-assets"
      - name: validate Dylint tool matrix
        env:
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/dylint-assets"

          # Require exactly one archive for every catalog target. This catches
          # a missing matrix runner and also rejects unexpected extra archives
          # before anything is attested or published.
          while IFS= read -r target; do
            test -f "$asset_dir/pina-dylint-tools-${target}-v${DYLINT_VERSION}.tar.gz"
          done < <(jq -r '.targets[]' crates/pina_cli/lints.json)
          expected_count="$(jq '.targets | length' crates/pina_cli/lints.json)"
          actual_count="$(find "$asset_dir" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          test "$actual_count" = "$expected_count"
          sha256sum "$asset_dir"/*.tar.gz
      - name: attest newly built Dylint tools
        if: needs.prepare_dylint_tools.outputs.required == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dylint-assets/*.tar.gz
      - name: create Dylint tool release
        if: needs.prepare_dylint_tools.outputs.required == 'true'
        env:
          DYLINT_COMMIT: ${{ needs.prepare_dylint_tools.outputs.commit }}
          DYLINT_TAG: ${{ needs.prepare_dylint_tools.outputs.tag }}
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Attestation happens before upload, and GitHub binds provenance to
          # each archive digest. Creating a separate non-latest release keeps
          # these reusable tools independent of any one Pina version.
          gh release create "$DYLINT_TAG" "$RUNNER_TEMP/dylint-assets"/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DYLINT_COMMIT" \
            --title "Dylint $DYLINT_VERSION tools for Pina" \
            --notes "Precompiled cargo-dylint and dylint-link $DYLINT_VERSION tools used by Pina releases. Each archive is target-native, SHA-256 identified by GitHub, and covered by a GitHub build-provenance attestation." \
            --latest=false
      - name: verify Dylint tool attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's attestation index is eventually consistent. Retry lookup
          # briefly, but never let lint compilation consume an unverified tool.
          for archive in "$RUNNER_TEMP/dylint-assets"/*.tar.gz; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  upload_assets:
    name: build ${{ matrix.target }}
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    # Upload native archives to the draft release and attest their provenance.
    permissions:
      attestations: write # Record provenance for the native CLI archives.
      contents: write # Upload archives and checksums to the draft release.
      id-token: write # Exchange GitHub's OIDC identity for an attestation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The release-pr tag job pushes the tag (firing this workflow) and then
      # creates the draft release. Wait for that draft release to exist before
      # uploading assets into it.
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: setup cross toolchain
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - name: install cross
        if: contains(matrix.target, '-musl')
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cross
      - name: set static crt linkage
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS:-} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: upload binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: pina
          manifest-path: crates/pina_cli/Cargo.toml
          profile: release
          ref: refs/tags/${{ env.RELEASE_TAG }}
          archive: pina-$target-${{ env.RELEASE_ASSET_TAG }}
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256,sha512

  upload_lint_bundles:
    name: build lints ${{ matrix.target }}
    needs:
      - prepare_dylint_tools
      - publish_dylint_tools
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    # Upload the completed native bundle to the draft release.
    permissions:
      attestations: read # Verify the downloaded Dylint tool provenance.
      contents: write # Upload the native lint bundle to the draft release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: install lint toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ needs.prepare_dylint_tools.outputs.toolchain }}
          components: rustc-dev
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: download verified Dylint tools
        env:
          DYLINT_TAG: ${{ needs.prepare_dylint_tools.outputs.tag }}
          DYLINT_TARGET: ${{ matrix.target }}
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Lint libraries must be linked by the target-native dylint-link from
          # the reusable tool release. Verify provenance before extracting it
          # or adding its directory to PATH.
          asset="pina-dylint-tools-${DYLINT_TARGET}-v${DYLINT_VERSION}.tar.gz"
          tools_dir="$RUNNER_TEMP/dylint-tools"
          mkdir -p "$tools_dir"
          gh release download "$DYLINT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir "$tools_dir"
          gh attestation verify "$tools_dir/$asset" --repo "$GITHUB_REPOSITORY"
          tar -xzf "$tools_dir/$asset" -C "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: build native lint bundle
        env:
          LINT_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          # Unlike the stable CLI tools, Dylint libraries are rustc-private and
          # therefore compile with the exact catalog nightly installed above.
          node scripts/lints/build-bundle.mjs \
            --target "$LINT_TARGET" \
            --release-tag "$RELEASE_TAG" \
            --output-dir "$RUNNER_TEMP/lint-assets"
      - name: upload native lint bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/lint-assets/pina-lints-${LINT_TARGET}-${RELEASE_TAG}.tar.gz"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  upload_musl_lint_bundles:
    name: build lints ${{ matrix.target }}
    needs:
      - prepare_dylint_tools
      - publish_dylint_tools
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    # Upload the completed native bundle to the draft release.
    permissions:
      attestations: read # Verify the downloaded Dylint tool provenance.
      contents: write # Upload the native musl lint bundle to the draft release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            rustup-sha256: a97c8f56d7462908695348dd8c71ea6740c138ce303715793a690503a94fc9a9
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            rustup-sha256: e6599a1c7be58a2d8eaca66a80e0dc006d87bbcf780a58b7343d6e14c1605cb2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: download verified musl Dylint tools
        env:
          DYLINT_TAG: ${{ needs.prepare_dylint_tools.outputs.tag }}
          DYLINT_TARGET: ${{ matrix.target }}
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="pina-dylint-tools-${DYLINT_TARGET}-v${DYLINT_VERSION}.tar.gz"
          mkdir -p "$RUNNER_TEMP/lint-assets"
          gh release download "$DYLINT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/lint-assets"
          gh attestation verify "$RUNNER_TEMP/lint-assets/$asset" --repo "$GITHUB_REPOSITORY"
      - name: build native musl lint bundle
        env:
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          LINT_TOOLCHAIN: ${{ needs.prepare_dylint_tools.outputs.toolchain }}
          LINT_TARGET: ${{ matrix.target }}
          RUSTUP_SHA256: ${{ matrix.rustup-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint-assets"

          # Build the rustc-private libraries inside the same native musl
          # boundary used for the tools. The tool archive was verified before
          # entering the container, and only the completed bundle is uploaded.
          docker run --rm \
            --env DYLINT_VERSION \
            --env LINT_TOOLCHAIN \
            --env LINT_TARGET \
            --env RELEASE_TAG \
            --env RUSTUP_SHA256 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/lint-assets:/lint-assets" \
            --workdir /workspace \
            alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1 \
            sh -euc '
              apk add --no-cache bash build-base ca-certificates cmake curl nodejs openssl-dev perl pkgconf
              rustup_url="https://static.rust-lang.org/rustup/archive/1.28.2/$LINT_TARGET/rustup-init"
              curl --proto "=https" --tlsv1.2 -sSf "$rustup_url" -o /tmp/rustup-init
              echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c -
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain "$LINT_TOOLCHAIN"
              . "$HOME/.cargo/env"
              rustup component add rustc-dev
              asset="/lint-assets/pina-dylint-tools-${LINT_TARGET}-v${DYLINT_VERSION}.tar.gz"
              mkdir -p /tmp/dylint-tools
              tar -xzf "$asset" -C /tmp/dylint-tools
              export PATH="/tmp/dylint-tools:$PATH"
              node scripts/lints/build-bundle.mjs \
                --target "$LINT_TARGET" \
                --release-tag "$RELEASE_TAG" \
                --output-dir /lint-assets
            '
      - name: upload native musl lint bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/lint-assets/pina-lints-${LINT_TARGET}-${RELEASE_TAG}.tar.gz"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  upload_freebsd_lint_bundle:
    name: build lints x86_64-unknown-freebsd
    needs:
      - prepare_dylint_tools
      - publish_dylint_tools
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    # Upload the completed native bundle to the draft release.
    permissions:
      attestations: read # Verify the downloaded Dylint tool provenance.
      contents: write # Upload the native FreeBSD lint bundle to the draft release.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: download verified FreeBSD Dylint tools
        env:
          DYLINT_TAG: ${{ needs.prepare_dylint_tools.outputs.tag }}
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="pina-dylint-tools-x86_64-unknown-freebsd-v${DYLINT_VERSION}.tar.gz"
          mkdir -p lint-assets
          gh release download "$DYLINT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir lint-assets
          gh attestation verify "lint-assets/$asset" --repo "$GITHUB_REPOSITORY"
      - name: build native FreeBSD lint bundle
        env:
          DYLINT_VERSION: ${{ needs.prepare_dylint_tools.outputs.version }}
          LINT_TOOLCHAIN: ${{ needs.prepare_dylint_tools.outputs.toolchain }}
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          usesh: true
          envs: RELEASE_TAG DYLINT_VERSION LINT_TOOLCHAIN
          prepare: pkg install -y cmake curl node24 pkgconf
          run: |
            set -euo pipefail

            # The VM provides a real FreeBSD ABI. Install the exact lint
            # nightly, unpack the already verified linker, then run the shared
            # bundle builder against every catalog lint crate.
            rustup_url='https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-freebsd/rustup-init'
            curl --proto '=https' --tlsv1.2 -sSf "$rustup_url" -o /tmp/rustup-init
            test "$(sha256 -q /tmp/rustup-init)" = '4d9fef2e40731489f3186c61a0f178d54d79864fe3d34791edf5b17f70074956'
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain "$LINT_TOOLCHAIN"
            . "$HOME/.cargo/env"
            rustup component add rustc-dev
            asset="lint-assets/pina-dylint-tools-x86_64-unknown-freebsd-v${DYLINT_VERSION}.tar.gz"
            mkdir -p /tmp/dylint-tools
            tar -xzf "$asset" -C /tmp/dylint-tools
            export PATH="/tmp/dylint-tools:$PATH"
            node scripts/lints/build-bundle.mjs \
              --target x86_64-unknown-freebsd \
              --release-tag "$RELEASE_TAG" \
              --output-dir ./lint-assets
      - name: upload native FreeBSD lint bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="lint-assets/pina-lints-x86_64-unknown-freebsd-${RELEASE_TAG}.tar.gz"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  attest_assets:
    name: attest release assets
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    needs:
      - upload_assets
      - upload_lint_bundles
      - upload_musl_lint_bundles
      - upload_freebsd_lint_bundle
    # Read release archives, then attach OIDC-backed provenance attestations.
    permissions:
      attestations: write # Record provenance for every release asset.
      contents: write # Download assets from the draft release for verification.
      id-token: write # Exchange GitHub's OIDC identity for an attestation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: download all release archives for attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"

          # This gate runs only after every CLI and lint matrix job succeeds.
          # Download the draft release as the source of truth so attestation
          # covers exactly the artifacts users will receive, not job-local files.
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pina-*' \
            --dir "$asset_dir"
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "$asset_dir"/*
      - name: attest all release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*
      - name: verify all release archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  publish:
    name: publish packages and release
    needs: attest_assets
    environment: publisher
    # Use OIDC for registry publishing, then publish the draft GitHub release.
    permissions:
      contents: write # Publish the draft GitHub release after registry publication.
      id-token: write # Authenticate to crates.io and npm trusted publishing.
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: validate release tag input
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a release tag like v0.9.0" >&2
            exit 1
          fi
        shell: bash
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc
      - name: setup cargo stable for publish
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: setup node for publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Use the Node/npm pair from devenv. npm discovers the GitHub OIDC
          # credentials itself; replacing it with a prefixed npm can bypass
          # trusted publishing and fail with ENEEDAUTH.
          node-version: 24
          package-manager-cache: false
      - name: prepare npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pnpm install --frozen-lockfile
          pnpm run build:codama-nodes
          pnpm run check:npm-packages
          pnpm run test:npm-packages

          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pina-*-${RELEASE_TAG}.tar.gz" \
            --pattern "pina-*-${RELEASE_TAG}.zip" \
            --dir "$assets_dir"
          node scripts/npm/package-cli.mjs \
            --release-tag "$RELEASE_TAG" \
            --assets-dir "$assets_dir"

          pack_report="$RUNNER_TEMP/pina-codama-nodes-pack.json"
          npm pack ./packages/nodes-from-pina --dry-run --json > "$pack_report"
          for required_file in \
            dist/index.js \
            dist/index.mjs \
            dist/types/index.d.ts; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$pack_report" >/dev/null || {
                echo "::error::npm package is missing $required_file" >&2
                exit 1
              }
          done

          npm pack ./packages/pina__cli --dry-run --json > "$RUNNER_TEMP/pina-cli-pack.json"
          jq -e 'any(.[0].files[]; .path == "bin/pina.cjs")' \
            "$RUNNER_TEMP/pina-cli-pack.json" >/dev/null

          npm pack ./packages/pina__skill --dry-run --json > "$RUNNER_TEMP/pina-skill-pack.json"
          for required_file in SKILL.md agents/openai.yaml references/program-authoring.md bin/pina-skill.cjs; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$RUNNER_TEMP/pina-skill-pack.json" >/dev/null || {
                echo "::error::@pina-rs/skill is missing $required_file" >&2
                exit 1
              }
          done

          for package_dir in packages/pina__cli-*; do
            package_name="$(jq -r .name "$package_dir/package.json")"
            binary_name=pina
            case "$package_name" in
              *-win32-*) binary_name=pina.exe ;;
            esac
            platform_report="$RUNNER_TEMP/$(basename "$package_dir")-pack.json"
            npm pack "./$package_dir" --dry-run --json > "$platform_report"
            jq -e --arg path "bin/$binary_name" \
              'any(.[0].files[]; .path == $path)' \
              "$platform_report" >/dev/null || {
                echo "::error::$package_name is missing bin/$binary_name" >&2
                exit 1
              }
          done
        shell: devenv shell -- bash -e {0}
      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          monochange step publish-readiness \
            --from HEAD \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      # Downstream Cargo packages cannot pass `cargo publish --dry-run` until
      # their same-release dependencies exist in crates.io. Dry-run the
      # independent packages here; monochange publishes them before dependents.
      - name: dry-run independently publishable packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          packages=(
            pina_codama_nodes
            pina_cli_darwin_arm64
            pina_cli_darwin_x64
            pina_cli_freebsd_x64
            pina_cli_linux_arm64_gnu
            pina_cli_linux_arm64_musl
            pina_cli_linux_x64_gnu
            pina_cli_linux_x64_musl
            pina_cli_win32_arm64_msvc
            pina_cli_win32_x64_msvc
            pina_skill
            pina_codama_renderer
            pina_macros
            pina_profile
            pina_sdk_ids
          )
          for package in "${packages[@]}"; do
            report="$RUNNER_TEMP/publish-dry-run-${package}.json"
            monochange step publish-packages \
              --dry-run \
              --package "$package" \
              --format json | tee "$report"
            jq -e '
              (.package_publish.packages | length == 1) and
                all(
                  .package_publish.packages[];
                  ((.stderr // "") | test("(^|\\n)error:") | not)
                )
            ' "$report" >/dev/null
          done
        shell: devenv shell -- bash -e {0}
      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |
          set -euo pipefail
          monochange step publish-packages \
            --log-level info \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
