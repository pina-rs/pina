name: publish

# Single workflow that builds release artifacts, publishes packages, and
# publishes the GitHub release. release-pr.yml explicitly dispatches it after
# creating the tag and draft release because a GITHUB_TOKEN tag push cannot
# trigger another workflow. The tag trigger remains as a fallback for tags
# created with credentials that are not subject to GitHub's recursion guard.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.8.0). Used by the automated release handoff and manual retries."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

# On a tag push github.ref_name is the tag (e.g. v0.9.0); on a manual
# workflow_dispatch retry inputs.tag is the tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_ASSET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  upload_assets:
    name: build ${{ matrix.target }}
    if: >-
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    # Upload native archives to the draft release and attest their provenance.
    permissions:
      attestations: write # Record provenance for the native CLI archives.
      contents: write # Upload archives and checksums to the draft release.
      id-token: write # Exchange GitHub's OIDC identity for an attestation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The release-pr tag job pushes the tag (firing this workflow) and then
      # creates the draft release. Wait for that draft release to exist before
      # uploading assets into it.
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: setup cross toolchain
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - name: install cross
        if: contains(matrix.target, '-musl')
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cross
      - name: set static crt linkage
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS:-} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: upload binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: pina
          manifest-path: crates/pina_cli/Cargo.toml
          profile: release
          ref: refs/tags/${{ env.RELEASE_TAG }}
          archive: pina-$target-${{ env.RELEASE_ASSET_TAG }}
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256,sha512

  attest_assets:
    name: attest release assets
    # Require every direct asset-producing dependency to succeed before the
    # release archives are attested.
    if: >-
      needs.upload_assets.result == 'success' &&
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    needs:
      - upload_assets
    # Read release archives, then attach OIDC-backed provenance attestations.
    permissions:
      attestations: write # Record provenance for every release asset.
      contents: write # Download assets from the draft release for verification.
      id-token: write # Exchange GitHub's OIDC identity for an attestation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: download all release archives for attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"

          # This gate runs only after every CLI matrix job succeeds.
          # Download the draft release as the source of truth so attestation
          # covers exactly the artifacts users will receive, not job-local files.
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pina-*' \
            --dir "$asset_dir"
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "$asset_dir"/*
      - name: attest all release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*
      - name: verify all release archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  publish:
    name: publish packages and release
    needs: attest_assets
    environment: publisher
    # Use OIDC for registry publishing, then publish the draft GitHub release.
    permissions:
      contents: write # Publish the draft GitHub release after registry publication.
      id-token: write # Authenticate to crates.io and npm trusted publishing.
    # Never publish unless every release asset was attested successfully.
    if: >-
      needs.attest_assets.result == 'success' &&
      github.repository_owner == 'pina-rs' &&
      startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: validate release tag input
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a release tag like v0.9.0" >&2
            exit 1
          fi
        shell: bash
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc
      - name: setup cargo stable for publish
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: setup node for publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Use the Node/npm pair from devenv. npm discovers the GitHub OIDC
          # credentials itself; replacing it with a prefixed npm can bypass
          # trusted publishing and fail with ENEEDAUTH.
          node-version: 24
          package-manager-cache: false
      - name: prepare npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pnpm install --frozen-lockfile
          pnpm run build:codama-nodes
          pnpm run check:npm-packages
          pnpm run test:npm-packages

          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pina-*-${RELEASE_TAG}.tar.gz" \
            --pattern "pina-*-${RELEASE_TAG}.zip" \
            --dir "$assets_dir"
          node scripts/npm/package-cli.mjs \
            --release-tag "$RELEASE_TAG" \
            --assets-dir "$assets_dir"

          pack_report="$RUNNER_TEMP/pina-codama-nodes-pack.json"
          npm pack ./packages/nodes-from-pina --dry-run --json > "$pack_report"
          for required_file in \
            dist/index.js \
            dist/index.mjs \
            dist/types/index.d.ts; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$pack_report" >/dev/null || {
                echo "::error::npm package is missing $required_file" >&2
                exit 1
              }
          done

          npm pack ./packages/pina__cli --dry-run --json > "$RUNNER_TEMP/pina-cli-pack.json"
          jq -e 'any(.[0].files[]; .path == "bin/pina.cjs")' \
            "$RUNNER_TEMP/pina-cli-pack.json" >/dev/null

          npm pack ./packages/pina__skill --dry-run --json > "$RUNNER_TEMP/pina-skill-pack.json"
          for required_file in SKILL.md agents/openai.yaml references/program-authoring.md bin/pina-skill.cjs; do
            jq -e --arg path "$required_file" \
              'any(.[0].files[]; .path == $path)' \
              "$RUNNER_TEMP/pina-skill-pack.json" >/dev/null || {
                echo "::error::@pina-rs/skill is missing $required_file" >&2
                exit 1
              }
          done

          for package_dir in packages/pina__cli-*; do
            package_name="$(jq -r .name "$package_dir/package.json")"
            binary_name=pina
            case "$package_name" in
              *-win32-*) binary_name=pina.exe ;;
            esac
            platform_report="$RUNNER_TEMP/$(basename "$package_dir")-pack.json"
            npm pack "./$package_dir" --dry-run --json > "$platform_report"
            jq -e --arg path "bin/$binary_name" \
              'any(.[0].files[]; .path == $path)' \
              "$platform_report" >/dev/null || {
                echo "::error::$package_name is missing bin/$binary_name" >&2
                exit 1
              }
          done
        shell: devenv shell -- bash -e {0}
      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          monochange step publish-readiness \
            --from HEAD \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish standalone pina_test workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          PUBLISH_STREAM_OUTPUT: "true"
        run: |
          set -euo pipefail

          # `pina_test` is an intentionally isolated Cargo workspace because
          # its Agave dependency set conflicts with the root workspace. The
          # bulk `--all` discovery does not cross that workspace boundary, so
          # publish it explicitly with the same OIDC token. This is idempotent:
          # Monochange skips the command when this version already exists.
          result="$RUNNER_TEMP/pina-test-publish-result.json"
          monochange step publish-packages \
            --log-level info \
            --package pina_test \
            --output "$result" \
            --format json
          jq -e '
            (.package_publish.packages | length == 1) and
              .package_publish.packages[0].package == "pina_test" and
              .package_publish.summary.failed == 0 and
              (
                .package_publish.summary.succeeded +
                  .package_publish.summary.skipped == 1
              )
          ' "$result" >/dev/null
        shell: devenv shell -- bash -e {0}
      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |
          set -euo pipefail
          monochange step publish-packages \
            --log-level info \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  verify_publication:
    name: require successful publication
    needs: publish
    # A skipped job normally counts as a successful workflow conclusion. Run
    # unconditionally so a broken dependency or condition cannot silently turn
    # a skipped package publication into a green release workflow.
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require the publication job to succeed
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RESULT" != 'success' ]; then
            echo "::error::The publication job concluded '$PUBLISH_RESULT'." >&2
            exit 1
          fi
