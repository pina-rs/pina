name: "release-preview"
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: preview release
        run: |
          set -euo pipefail
          echo "## Release Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if ls .changeset/*.md 1>/dev/null 2>&1; then
            echo "### Changesets found:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for f in .changeset/*.md; do
              echo "--- $f ---" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changesets found in .changeset/" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Dry-run output:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          preview_status=0
          monochange preview --format md 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || preview_status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$preview_status"
        shell: devenv shell -- bash -e {0}
