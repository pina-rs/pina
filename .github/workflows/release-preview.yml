name: "release-preview"
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The preview is only meaningful when a pull request adds or removes
# changesets, or when it carries the `release` label used by release pull
# requests. Everything else skips the job; `ci-full` forces a run.
jobs:
  changes:
    name: detect changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # Manual dispatches always run the preview; detection only gates pull
    # requests.
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      changesets: ${{ steps.filter.outputs.changesets_any_changed }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify changed paths
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            changesets:
              - .changeset/**
              - .github/workflows/release-preview.yml

  preview:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.changesets == 'true' || contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: preview release
        run: |
          set -euo pipefail
          echo "## Release Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if ! ls .changeset/*.md 1>/dev/null 2>&1; then
            release_record="$RUNNER_TEMP/release-record.json"
            release_record_error="$RUNNER_TEMP/release-record-error.txt"

            if ! monochange step release-record \
              --from HEAD \
              --format json \
              > "$release_record" \
              2> "$release_record_error"; then
              echo "Failed to generate the release record." >&2
              cat "$release_record_error" >&2
              exit 1
            fi

            resolved_commit="$(jq -r '.resolved_commit // "<missing>"' "$release_record")"
            record_commit="$(jq -r '.record_commit // "<missing>"' "$release_record")"
            distance="$(jq -r '.distance // -1' "$release_record")"
            release_target_count="$(jq -r '.record.release_targets | length' "$release_record")"

            if [[ "$resolved_commit" == "$record_commit" ]] &&
              ((release_target_count > 0)); then
              echo "### Prepared release record" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              jq '{
                commit: .record_commit,
                versions: .record.versions,
                released_packages: .record.released_packages
              }' "$release_record" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            subject="$(git log -1 --pretty=%s)"
            body="$(git log -1 --pretty=%B)"
            if ((distance > 0)) &&
              [[ "$subject" != chore\(release\):\ prepare\ release* ]] &&
              ! grep -q '<!-- monochange:release-record:start -->' <<<"$body"; then
              echo "### No pending release" >> "$GITHUB_STEP_SUMMARY"
              echo "No changesets remain after the previous prepared release." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [[ "$resolved_commit" != "$record_commit" ]]; then
              echo "Release record does not resolve to HEAD:" >&2
              echo "  resolved commit: $resolved_commit" >&2
              echo "  record commit:   $record_commit" >&2
            fi
            if ((release_target_count == 0)); then
              echo "Release record contains no release targets." >&2
            fi
            exit 1
          fi

          echo "### Changesets found:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in .changeset/*.md; do
            echo "--- $f ---" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Dry-run output:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          preview_status=0
          preview_output="$(monochange preview --format md 2>&1)" || {
            if printf '%s\n' "$preview_output" | grep -q "no releaseable packages"; then
              echo "### No releaseable packages in current changesets" >> "$GITHUB_STEP_SUMMARY"
              echo "All bumps are \`none\`; nothing to release." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$preview_output" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          printf '%s\n' "$preview_output" | tee -a "$GITHUB_STEP_SUMMARY"
          preview_status=0
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$preview_status"
        shell: devenv shell -- bash -e {0}
