name: changeset-policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      # Re-check a pull request whose base branch changed, such as a stacked
      # pull request retargeted after the branch below it merged.
      - edited

permissions:
  contents: read

concurrency:
  group: changeset-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The policy check must run on every pull request (its whole purpose is
# catching missing changesets), so it is the one devenv job without path
# gating. Change classification was folded into this job so a pull request
# pays for the nix/devenv setup once instead of twice.
jobs:
  check:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      # Commenting on a pull request needs the pull-requests write scope: with
      # only `issues: write` the comment API returns 403 "Resource not
      # accessible by integration", and the action degrades to a warning.
      pull-requests: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup devenv
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: add devenv monochange to PATH
        run: |
          set -euo pipefail
          profile="$(devenv shell -- bash -c 'printf %s "${DEVENV_PROFILE:-}"')"
          if [[ -z "$profile" ]]; then
            echo "devenv profile was not resolved." >&2
            exit 1
          fi
          echo "$profile/bin" >> "$GITHUB_PATH"
          "$profile/bin/monochange" --version
        shell: bash

      - name: collect changed files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - name: run changeset policy
        uses: monochange/actions/changeset-policy@6866cbbd35932bdfb496f5b144578c9274d36ca0 # v0.10.0
        with:
          # Coverage-based verification: every changed package must be covered
          # by a changeset. Passing explicit changed paths instead of `from`
          # deliberately skips the API-impact classifier, which misclassifies
          # rustdoc-only and additive changes as major on this workspace
          # (monochange 0.11.1 flagged a docs-only PR as needing a major bump).
          changed-paths: ${{ steps.changed.outputs.all_changed_files }}
          setup-monochange: false
          labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: classify changes
        # Classify even when the policy step fails, so the comment always
        # describes the latest push instead of an earlier commit.
        if: ${{ !cancelled() }}
        # v0.9.4 moved to the `schema_version` contract monochange 0.14 emits
        # ("0.2"), so this pin and the CLI must move together: 0.9.2 parses the
        # integer `schemaVersion` that 0.13 emitted, and 0.9.4 rejects it with
        # "did not return a supported change-classification report".
        uses: monochange/actions/change-classification@6866cbbd35932bdfb496f5b144578c9274d36ca0 # v0.10.0
        with:
          setup-monochange: false
          # Compare with the branch this pull request targets, not `main`, so a
          # stacked pull request does not report its parent's changes, and name
          # the pushed head commit rather than GitHub's synthetic merge commit.
          base: origin/${{ github.event.pull_request.base.ref }}
          head: ${{ github.event.pull_request.head.sha }}
          detection-level: signature
          dependency-propagation: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
