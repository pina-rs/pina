name: "migrations-walkthrough-nightly"
permissions:
  contents: read

# Nightly end-to-end walkthrough: one program, ten migrations, ten
# deployments against isolated Surfpool networks with regenerated clients.
on:
  schedule:
    # Run every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: migrations-walkthrough-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  walkthrough:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run migration walkthrough
        run: walkthrough:migrations
        shell: devenv shell -c -- bash -e {0}

      - name: upload walkthrough artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migrations-walkthrough
          path: target/migrations-walkthrough
          if-no-files-found: ignore
