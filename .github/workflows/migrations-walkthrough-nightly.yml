name: "migrations-walkthrough-nightly"
permissions:
  contents: read

# Nightly end-to-end walkthrough: one program, ten migrations, ten
# deployments against isolated Surfpool networks with regenerated clients.
on:
  schedule:
    # Run every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: migrations-walkthrough-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  walkthrough:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: setup Dart SDK
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.13.0"

      - name: install surfpool CLI
        uses: $/.github/actions/install-tools
        with:
          surfpool: "true"

      - name: setup SBF toolchain
        uses: $/.github/actions/setup-sbf

      - name: run migration walkthrough
        run: node scripts/ci-tasks.ts walkthrough:migrations
        shell: bash

      - name: upload walkthrough artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrations-walkthrough
          path: target/migrations-walkthrough
          if-no-files-found: ignore
