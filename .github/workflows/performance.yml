name: "performance"
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
    # Benchmarks only carry signal when program or runtime code, their build
    # inputs, or the benchmark harness itself change. The performance workflow
    # is not a required status check, so a skipped run (and its missing PR
    # comment) is safe for docs- and tooling-only pull requests. Pushes to
    # `main` do not run this workflow: benchmarks compare against the PR base.
    paths:
      - crates/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - devenv.nix
      - devenv.lock
      - devenv.yaml
      - .github/actions/**
      - scripts/benchmark-cli.ts
      - scripts/benchmark-core.ts
      - scripts/profile-tracked-examples.ts
      - scripts/profile-example-diffs.ts
      - scripts/build-runtime-compute-units.ts
      - scripts/measure-example-compute-units.ts
      - scripts/measure-runtime-compute-units.ts
      - scripts/compare-compute-units.ts
      - scripts/compute-unit-policy.json
      - .github/workflows/performance.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release pull requests only re-version published packages, so benchmarking
# them carries no signal. Every job skips when the pull request carries the
# `release` label; skipped jobs still report success to required checks.
#
# Benchmark results are advisory: they report through the consolidated PR
# comment, and none of these jobs is a required status check on `main`.
jobs:
  program-profiles:
    name: program compute units and sizes
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/performance-build/programs
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: setup SBF toolchain
        uses: $/.github/actions/setup-sbf

      # Static ELF sizes and static CU profiles are deterministic per base SHA,
      # so parallel PRs based on the same `main` commit reuse the base profile.
      - name: cache base program profiles
        id: base-profiles-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/performance/programs/base
          key: ${{ runner.os }}-perf-programs-base-v1-${{ github.event.pull_request.base.sha }}

      - name: create base worktree
        if: ${{ steps.base-profiles-cache.outputs.cache-hit != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../pina-performance-base "$BASE_SHA"
        shell: bash

      - name: profile base programs
        if: ${{ steps.base-profiles-cache.outputs.cache-hit != 'true' }}
        run: |
          node ./scripts/profile-tracked-examples.ts \
            "$GITHUB_WORKSPACE/../pina-performance-base" \
            "$GITHUB_WORKSPACE/target/performance/programs/base"
        shell: bash

      - name: profile head programs
        run: |
          node ./scripts/profile-tracked-examples.ts \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/target/performance/programs/head"
        shell: bash

      - name: compare program reports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          node ./scripts/compare-compute-units.ts \
            --policy-file ./scripts/compute-unit-policy.json \
            --base-revision "$BASE_SHA" \
            --base-dir ./target/performance/programs/base \
            --head-dir ./target/performance/programs/head \
            --markdown-output ./target/performance/programs/report.md \
            --json-output ./target/performance/programs/report.json \
            --static-only
          status=$?
          set -e

          printf '%s\n' "$status" > ./target/performance/programs/compare.status
        shell: bash

      # Diagnostic only: the script exits 0 unless it cannot run at all, so the
      # independent CU and size policy gates above remain the enforcement point.
      - name: diff program function profiles
        if: always()
        run: |
          node ./scripts/profile-example-diffs.ts \
            ./target/performance/programs/base \
            ./target/performance/programs/head \
            ./target/performance/programs/function-diffs
        shell: bash

      - name: prepare program report
        id: program-report
        if: always()
        run: |
          mkdir -p ./target/performance/programs
          if [ ! -f ./target/performance/programs/report.md ]; then
            printf '## Program compute units and build sizes\n\n⚠️ The benchmark did not finish. See the job log.\n' \
              > ./target/performance/programs/report.md
          fi

          status=''
          if [ -f ./target/performance/programs/compare.status ]; then
            status="$(tr -d '\n' < ./target/performance/programs/compare.status)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat ./target/performance/programs/report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: upload program report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-programs
          path: target/performance/programs
          if-no-files-found: error

      - name: enforce program performance thresholds
        if: always()
        env:
          COMPARE_STATUS: ${{ steps.program-report.outputs.status }}
        run: |
          if [ -z "$COMPARE_STATUS" ]; then
            echo "program comparison did not finish" >&2
            exit 1
          fi

          exit "$COMPARE_STATUS"
        shell: bash

  instruction-compute:
    name: instruction compute units
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
    # Budgets cover setup, the base/head runtime builds (with base cached by
    # SHA across PRs targeting the same `main` commit), and Surfpool runs.
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: setup SBF toolchain
        uses: $/.github/actions/setup-sbf

      # Recorded instruction CUs are deterministic per base commit, so reuse
      # the base measurement across pushes sharing the same `main` SHA. Restore
      # first and save only when the base report is complete (no failed batches
      # or missing cases).
      - name: restore base instruction compute units
        id: base-cu-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/performance/instructions/runtime-base.json
          key: ${{ runner.os }}-perf-instructions-base-v1-${{ github.event.pull_request.base.sha }}-${{ hashFiles('scripts/measure-example-compute-units.ts', 'scripts/compute-unit-policy.json') }}

      - name: create base worktree
        if: ${{ steps.base-cu-cache.outputs.cache-hit != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../pina-performance-base "$BASE_SHA"
        shell: bash

      - name: build runtime programs
        env:
          BASE_CACHE_HIT: ${{ steps.base-cu-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$BASE_CACHE_HIT" == "true" ]]; then
            node ./scripts/build-runtime-compute-units.ts \
              --examples-only \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/target/performance-build/instructions/head"
          else
            node ./scripts/build-runtime-compute-units.ts \
              --examples-only \
              "$GITHUB_WORKSPACE/../pina-performance-base" \
              "$GITHUB_WORKSPACE/target/performance-build/instructions/base" \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/target/performance-build/instructions/head"
          fi
        shell: bash

      - name: measure base and head instructions
        id: measure-instructions
        # Surfpool test binaries can hang indefinitely (the SDK's startup wait
        # has no timeout). The measure script terminates an individual batch
        # after 30 minutes; this bounds the whole step for hangs the watchdog
        # does not cover instead of consuming the job budget below.
        timeout-minutes: 80
        env:
          BASE_CACHE_HIT: ${{ steps.base-cu-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          base_complete=false
          if [[ "$BASE_CACHE_HIT" != "true" ]]; then
            node "$GITHUB_WORKSPACE/scripts/measure-example-compute-units.ts" \
              "$GITHUB_WORKSPACE/../pina-performance-base" \
              "$GITHUB_WORKSPACE/../pina-performance-base" \
              "$GITHUB_WORKSPACE/target/performance-build/instructions/base" \
              "$GITHUB_WORKSPACE/target/performance/instructions/runtime-base.json" \
              --allow-incomplete
            if jq -e '(.cases | length > 0) and (.missingCases | length == 0) and (.testFailures | length == 0) and (.unavailablePrograms | length == 0)' \
              "$GITHUB_WORKSPACE/target/performance/instructions/runtime-base.json" >/dev/null; then
              base_complete=true
            fi
          fi
          echo "base_complete=${base_complete}" >> "$GITHUB_OUTPUT"

          node ./scripts/measure-example-compute-units.ts \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/target/performance-build/instructions/head" \
            "$GITHUB_WORKSPACE/target/performance/instructions/runtime-head.json"
        shell: bash

      - name: save complete base instruction compute units
        if: ${{ steps.base-cu-cache.outputs.cache-hit != 'true' && steps.measure-instructions.outputs.base_complete == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/performance/instructions/runtime-base.json
          key: ${{ runner.os }}-perf-instructions-base-v1-${{ github.event.pull_request.base.sha }}-${{ hashFiles('scripts/measure-example-compute-units.ts', 'scripts/compute-unit-policy.json') }}

      - name: compare instruction reports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          mkdir -p ./target/performance/instructions/empty-base \
            ./target/performance/instructions/empty-head
          node ./scripts/compare-compute-units.ts \
            --policy-file ./scripts/compute-unit-policy.json \
            --base-revision "$BASE_SHA" \
            --base-dir ./target/performance/instructions/empty-base \
            --head-dir ./target/performance/instructions/empty-head \
            --base-runtime ./target/performance/instructions/runtime-base.json \
            --head-runtime ./target/performance/instructions/runtime-head.json \
            --markdown-output ./target/performance/instructions/report.md \
            --json-output ./target/performance/instructions/report.json \
            --runtime-only
          status=$?
          set -e

          printf '%s\n' "$status" > ./target/performance/instructions/compare.status
        shell: bash

      - name: prepare instruction report
        id: instruction-report
        if: always()
        run: |
          mkdir -p ./target/performance/instructions
          if [ ! -f ./target/performance/instructions/report.md ]; then
            printf '## Instruction compute units\n\n⚠️ The benchmark did not finish. See the job log.\n' \
              > ./target/performance/instructions/report.md
          fi

          status=''
          if [ -f ./target/performance/instructions/compare.status ]; then
            status="$(tr -d '\n' < ./target/performance/instructions/compare.status)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat ./target/performance/instructions/report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: upload instruction report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-instructions
          path: target/performance/instructions
          if-no-files-found: error

      - name: enforce instruction compute-unit threshold
        if: always()
        env:
          COMPARE_STATUS: ${{ steps.instruction-report.outputs.status }}
        run: |
          if [ -z "$COMPARE_STATUS" ]; then
            echo "instruction compute-unit comparison did not finish" >&2
            exit 1
          fi

          exit "$COMPARE_STATUS"
        shell: bash

  token-loader-compute:
    name: focused token-loader compute units
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: surfpool
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: setup SBF toolchain
        uses: $/.github/actions/setup-sbf

      - name: cache base token-loader compute units
        id: base-token-loader-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/performance/token-loader/exact-runtime-base.json
          key: ${{ runner.os }}-perf-token-loader-base-v1-${{ github.event.pull_request.base.sha }}-${{ hashFiles('tests/fixtures/token_loader_cu_program/**', 'tests/compute_units.rs', 'scripts/measure-runtime-compute-units.ts') }}

      - name: create base worktree
        if: ${{ steps.base-token-loader-cache.outputs.cache-hit != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../pina-performance-base "$BASE_SHA"
        shell: bash

      - name: build token-loader programs
        env:
          BASE_CACHE_HIT: ${{ steps.base-token-loader-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$BASE_CACHE_HIT" == "true" ]]; then
            node ./scripts/build-runtime-compute-units.ts \
              --token-loader-only \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/target/performance-build/token-loader/head"
          else
            node ./scripts/build-runtime-compute-units.ts \
              --token-loader-only \
              "$GITHUB_WORKSPACE/../pina-performance-base" \
              "$GITHUB_WORKSPACE/target/performance-build/token-loader/base" \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/target/performance-build/token-loader/head"
          fi
        shell: bash

      - name: measure exact base token-loader cases
        if: ${{ steps.base-token-loader-cache.outputs.cache-hit != 'true' }}
        run: |
          node ./scripts/measure-runtime-compute-units.ts \
            --token-loader-only \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/../pina-performance-base" \
            "$GITHUB_WORKSPACE/target/performance-build/token-loader/base" \
            "$GITHUB_WORKSPACE/target/performance/token-loader/exact-runtime-base.json"
        shell: bash

      - name: measure exact head token-loader cases
        run: |
          node ./scripts/measure-runtime-compute-units.ts \
            --token-loader-only \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/target/performance-build/token-loader/head" \
            "$GITHUB_WORKSPACE/target/performance/token-loader/exact-runtime-head.json"
        shell: bash

      - name: compare exact token-loader reports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          mkdir -p ./target/performance/token-loader/empty-base \
            ./target/performance/token-loader/empty-head
          node ./scripts/compare-compute-units.ts \
            --policy-file ./scripts/compute-unit-policy.json \
            --base-revision "$BASE_SHA" \
            --base-dir ./target/performance/token-loader/empty-base \
            --head-dir ./target/performance/token-loader/empty-head \
            --base-exact-runtime ./target/performance/token-loader/exact-runtime-base.json \
            --head-exact-runtime ./target/performance/token-loader/exact-runtime-head.json \
            --markdown-output ./target/performance/token-loader/report.md \
            --json-output ./target/performance/token-loader/report.json \
            --runtime-only
          status=$?
          set -e

          sed -i '1s/Instruction compute units/Focused token-loader compute units/' \
            ./target/performance/token-loader/report.md
          printf '%s\n' "$status" > ./target/performance/token-loader/compare.status
        shell: bash

      - name: prepare token-loader report
        id: token-loader-report
        if: always()
        run: |
          mkdir -p ./target/performance/token-loader
          if [ ! -f ./target/performance/token-loader/report.md ]; then
            printf '## Focused token-loader compute units\n\n⚠️ The benchmark did not finish. See the job log.\n' \
              > ./target/performance/token-loader/report.md
          fi

          status=''
          if [ -f ./target/performance/token-loader/compare.status ]; then
            status="$(tr -d '\n' < ./target/performance/token-loader/compare.status)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat ./target/performance/token-loader/report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: upload token-loader report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-token-loader
          path: target/performance/token-loader
          if-no-files-found: error

      - name: enforce token-loader compute-unit threshold
        if: always()
        env:
          COMPARE_STATUS: ${{ steps.token-loader-report.outputs.status }}
        run: |
          if [ -z "$COMPARE_STATUS" ]; then
            echo "token-loader compute-unit comparison did not finish" >&2
            exit 1
          fi

          exit "$COMPARE_STATUS"
        shell: bash

  cli:
    name: CLI performance
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: install hyperfine
        uses: $/.github/actions/install-tools
        with:
          tools: hyperfine@1.20.0

      - name: cache base CLI binary
        id: base-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/performance-build/cli/base-bin
          key: ${{ runner.os }}-perf-cli-base-bin-v1-${{ github.event.pull_request.base.sha }}

      - name: create base worktree
        if: ${{ steps.base-cli-cache.outputs.cache-hit != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../pina-performance-base "$BASE_SHA"
        shell: bash

      - name: build base and head CLIs
        env:
          BASE_CACHE_HIT: ${{ steps.base-cli-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # Separate target dirs: sharing one makes cargo reuse the base
          # build's pina_profile rlib for the head build when only content
          # (not mtime) differs, and the head CLI then fails with missing
          # symbols for anything the PR added to pina_profile.
          mkdir -p ./target/performance-build/cli/base-bin ./target/performance-build/cli/head-bin
          if [[ "$BASE_CACHE_HIT" != "true" ]]; then
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/performance-build/cli/base-target" \
              cargo build --release --locked -p pina_cli \
              --manifest-path "$GITHUB_WORKSPACE/../pina-performance-base/Cargo.toml"
            cp ./target/performance-build/cli/base-target/release/pina \
              ./target/performance-build/cli/base-bin/pina
          fi
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/performance-build/cli/head-target" \
            cargo build --release --locked -p pina_cli
          cp ./target/performance-build/cli/head-target/release/pina \
            ./target/performance-build/cli/head-bin/pina
        shell: bash

      - name: benchmark CLI
        env:
          PINA_HYPERFINE_BIN: hyperfine
        run: |
          node ./scripts/benchmark-cli.ts \
            --base-bin ./target/performance-build/cli/base-bin/pina \
            --head-bin ./target/performance-build/cli/head-bin/pina \
            --markdown-output ./target/performance/cli/report.md \
            --json-output ./target/performance/cli/report.json
        shell: bash

      - name: prepare CLI report
        if: always()
        run: |
          mkdir -p ./target/performance/cli
          if [ ! -f ./target/performance/cli/report.md ]; then
            printf '## CLI performance\n\n⚠️ The benchmark did not finish. See the job log.\n' \
              > ./target/performance/cli/report.md
          fi
          cat ./target/performance/cli/report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: upload CLI report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-cli
          path: target/performance/cli
          if-no-files-found: error

  core:
    name: core host performance
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: host
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION }}
          sccache-access-key-id: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: create base worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../pina-performance-base "$BASE_SHA"
        shell: bash

      - name: benchmark core code
        run: |
          node ./scripts/benchmark-core.ts \
            "$GITHUB_WORKSPACE/../pina-performance-base" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/target/performance/core" \
            "$GITHUB_WORKSPACE/target/performance-build/core"
        shell: bash

      - name: prepare core report
        if: always()
        run: |
          mkdir -p ./target/performance/core
          if [ ! -f ./target/performance/core/core.md ]; then
            printf '## Core host performance\n\n⚠️ The benchmark did not finish. See the job log.\n' \
              > ./target/performance/core/core.md
          fi
          cat ./target/performance/core/core.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: upload core report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-core
          path: target/performance/core
          if-no-files-found: error

  comment:
    name: PR performance comment
    # `!cancelled()` still runs this job when a benchmark job fails, so a real
    # failure is reported as an unavailable section. It skips a run that
    # concurrency cancelled for a newer push: that run has no reports to post,
    # and its failing check would outlive the run that replaced it.
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'release') }}
    needs:
      - instruction-compute
      - token-loader-compute
      - program-profiles
      - cli
      - core
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: download benchmark reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: performance-*
          path: target/performance/reports

      - name: assemble PR comment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest_tag="$(git describe --tags --abbrev=0 "$BASE_SHA" 2>/dev/null || true)"
          base_short="${BASE_SHA:0:8}"
          head_short="${HEAD_SHA:0:8}"
          # The download creates this directory only when an artifact exists.
          mkdir -p ./target/performance

          append_report() {
            local path="$1"
            local heading="$2"

            if [ -f "$path" ]; then
              cat "$path"
              return
            fi

            echo "## $heading"
            echo
            echo "⚠️ Benchmark report unavailable. See the workflow job log."
          }

          {
            echo "# Performance report"
            echo
            echo "Comparing head \`$head_short\` with the pull request base \`$base_short\`."
            if [ -n "$latest_tag" ]; then
              latest_sha="$(git rev-list -n 1 "$latest_tag")"
              if [ "$latest_sha" = "$BASE_SHA" ]; then
                echo "The base is also the latest release, \`$latest_tag\`."
              else
                echo "Latest release: \`$latest_tag\` at \`${latest_sha:0:8}\` (shown for context; timings compare against the PR base)."
              fi
            fi
            echo "Each section shows its result at a glance. Expand the details to inspect the full table."
            echo
            append_report ./target/performance/reports/performance-instructions/report.md "Instruction compute units"
            echo
            append_report ./target/performance/reports/performance-token-loader/report.md "Focused token-loader compute units"
            echo
            append_report ./target/performance/reports/performance-programs/report.md "Program compute units and build sizes"
            echo
            append_report ./target/performance/reports/performance-programs/function-diffs/function-diff.md "Program function-level profile diffs"
            echo
            append_report ./target/performance/reports/performance-cli/report.md "CLI performance"
            echo
            append_report ./target/performance/reports/performance-core/core.md "Core host performance"
            echo
            echo "CLI and host timings are advisory; instruction-CU regressions enforce the configured policy."
          } > ./target/performance/comment.md
        shell: bash

      - name: post performance comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: performance-benchmarks
          path: target/performance/comment.md
