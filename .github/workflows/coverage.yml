name: "coverage"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This job is the pull request's Rust gate. It runs the complete suite that the
# `test` job used to run, under a profiling build, and publishes a patch
# coverage status. `test` now covers the post-merge and `ci-full` tiers, so a
# pull request pays for one job instead of two. The two must stay equivalent:
# `coverage:all` is a superset of `test:all`, and any suite added to one
# belongs in the other.
#
# Gating mirrors the `test` job it replaced: the suite only carries signal when
# Rust, script, or toolchain inputs change, and this is a required status check,
# so it is filtered with a job-level condition rather than workflow-level
# `paths:`. A workflow that never runs leaves its check in "Expected" and blocks
# merging, while a skipped job reports success.
jobs:
  changes:
    name: detect changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      covered: ${{ steps.filter.outputs.covered_any_changed }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify changed paths
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            covered:
              - crates/**
              - examples/**
              - scripts/**
              - codama/**
              # The root package (`pina_root`) is the workspace root itself, so
              # its sources sit here rather than under a `pina_root/` directory.
              - src/**
              - tests/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
              - tsconfig.scripts.json
              - devenv.nix
              - devenv.lock
              - devenv.yaml
              - .github/actions/devenv/**

  coverage:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: changes
    env:
      # Keep the tool cache at an absolute path, as `program-e2e` does. Test
      # tasks create a temporary HOME outside the worktree when CI omits it,
      # so generated-output containment never includes the home directory.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    # The status functions are required: without one, a skipped `changes`
    # dependency (pushes to `main`) would skip this job too.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.covered == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run coverage
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            mkdir -p target/coverage
            cargo llvm-cov --all-features --locked -p pina_cli --lib --test rehearse_worker_lifecycle --test cli_snapshots --lcov --output-path target/coverage/lcov.info
          else
            coverage:all
          fi
        shell: devenv shell -c -- bash -e {0}

      - name: upload lcov artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/coverage/*.info

      - name: upload codecov report
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/lcov.info,target/coverage/pina-test.info
          fail_ci_if_error: true
          use_oidc: true
