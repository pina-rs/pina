name: "mutants-pr"
permissions:
  contents: read

# Run mutation testing on pull requests scoped to changed workspace crates.
on:
  pull_request:
    branches:
      - main
    paths:
      - "crates/**"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants-pr.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changed-crates:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: detect changed crates
        id: changed
        run: |
          set -euo pipefail

          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref" --depth=1 || true

          changed_files=$(git diff --name-only "origin/${base_ref}...HEAD" || true)
          if [ -z "$changed_files" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build a JSON matrix of changed packages that belong to the root
          # workspace. Standalone workspaces such as pina_fuzz must not be sent
          # to `cargo mutants -p` from the repository root.
          packages=()
          workspace_root=$(pwd)
          while IFS=$'\t' read -r pkg manifest; do
            dir=${manifest#"$workspace_root/"}
            dir=$(dirname "$dir")
            if echo "$changed_files" | grep -qE "^${dir}/(Cargo.toml|build.rs|src/|tests/|benches/|examples/)"; then
              packages+=("$pkg")
            fi
          done < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r --arg root "$workspace_root/crates/" \
                '.packages[] | select(.manifest_path | startswith($root)) | [.name, .manifest_path] | @tsv'
          )

          if [ ${#packages[@]} -eq 0 ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "any_changed=true" >> "$GITHUB_OUTPUT"
          # Build a simple JSON array of package names for a matrix job.
          json=$(printf '%s\n' "${packages[@]}" | jq -R . | jq -cs '{package: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  mutants:
    needs: detect-changed-crates
    if: needs.detect-changed-crates.outputs.any_changed == 'true'
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changed-crates.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Mutate only the lines this pull request changes. A whole crate does not
      # fit the job: `pina_cli` alone yields thousands of mutants, which the
      # nightly run covers in rotating shards instead.
      - name: write the pull request diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1 || true
          mkdir -p target
          git diff "origin/${BASE_REF}...HEAD" > target/mutants-pr.diff

      - name: prepare the mutation baseline
        run: mutants:prepare
        shell: devenv shell -c -- bash -e {0}

      # `--in-place` mutates this disposable checkout instead of a copy, which
      # keeps what `mutants:prepare` installed and the git worktree that
      # `pina.toml`'s `{{root}}` anchor resolves through. The exit status is
      # kept in a file because the clean devenv shell does not see
      # `GITHUB_OUTPUT`.
      - name: run mutation tests for ${{ matrix.package }}
        id: mutation_tests
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          status=0
          mutants:crate "$PACKAGE" --in-diff target/mutants-pr.diff --in-place || status=$?
          mkdir -p target/mutants
          echo "$status" > target/mutants/exit-status
          exit "$status"
        shell: devenv shell -c PACKAGE -- bash -e {0}

      # Missed mutants and timeouts (cargo-mutants exits 2 and 3) are advisory
      # on pull requests, but the failed step and summary must remain visible
      # instead of presenting a false-green run. Any other failure means no
      # mutant was tested, such as a failing baseline, so it fails the job.
      - name: report mutation test outcome
        if: always() && steps.mutation_tests.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          status="$(cat target/mutants/exit-status 2>/dev/null || echo missing)"
          case "$status" in
            2 | 3)
              echo "::warning::Mutation testing found surviving mutants or timeouts for ${PACKAGE}. Review the uploaded report."
              echo "### Mutation testing needs attention: \`${PACKAGE}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "cargo-mutants exited ${status}: some mutants survived or timed out. Review the uploaded report." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Mutation testing could not run for ${PACKAGE} (exit status ${status}). Check the mutation step's log."
              echo "### Mutation testing failed: \`${PACKAGE}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "cargo-mutants exited ${status}, so no mutants were tested." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - name: upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report-${{ matrix.package }}
          path: target/mutants
