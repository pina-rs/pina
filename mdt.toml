# Format block content through the repository formatter, so a block written
# into a consumer and then re-padded by dprint is not reported stale. Without
# this, `docs:sync` and `dprint fmt` fight over table padding: mdt writes the
# template's spacing, dprint re-pads it, and `docs:check` then fails on the
# dprint-canonical file. Templates stay hand-formatted because dprint excludes
# `**/*.t.md`.
[[formatters]]
command = "dprint fmt --stdin \"{{ filePath }}\""
patterns = ["**/*.md", "**/*.rs"]
ignore = ["**/*.t.md"]

[padding]
before = 0
after = false

# Data context for inline interpolation. `cargo.workspace.package.version` is
# the single version every published `pina` crate inherits, so the readme can
# name the current release without a hand-maintained string. The key is `cargo`
# rather than `workspace` because a data key named `workspace` shadows the
# `[workspace]` table and resolves `package.version` against the root package
# instead (`pina_root` is versioned separately and never published). The
# monochange release flow runs `fix:format` (which ends in `docs:sync` ->
# `mdt update`) after bumping versions, which refreshes every reference on each
# release.
[data]
cargo = "Cargo.toml"
