[package]
name = "pina_root"
version = "0.0.5"
edition = "2024"
publish = false
description = "Internal cross-crate test harness for the Pina workspace; never published."

[dependencies]
pina = { workspace = true, features = ["compact", "derive", "token"] }
pina_macros = { workspace = true, features = ["compact"] }

[dev-dependencies]
account_realloc_program = { path = "examples/account_realloc_program", version = "0.0.0" }
counter_program = { path = "examples/counter_program", version = "0.0.0" }
insta = { workspace = true }
macrotest = { workspace = true }
mollusk-svm = { workspace = true, default-features = true }
prettyplease = { workspace = true }
profile_program = { path = "examples/profile_program", version = "0.0.0" }
quote = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-account = { workspace = true, default-features = true }
solana-instruction = { workspace = true, default-features = true }
solana-pubkey = { workspace = true, default-features = true }
solana-sdk-ids = { workspace = true, default-features = true }
syn = { workspace = true, features = ["full"] }
trybuild = { workspace = true }

[workspace.package]
version = "0.15.0"
edition = "2024"
homepage = "https://pina.rs"
keywords = ["solana", "pinocchio"]
license = "Apache-2.0"
readme = "readme.md"
repository = "https://github.com/pina-rs/pina"
rust-version = "1.89.0"

[workspace.dependencies]
atomic-write-file = { default-features = false, version = "^0.3" }
base64 = { default-features = false, version = "^0.23.1" }
bs58 = { default-features = false, version = "^0.5.1" }
cap-fs-ext = { default-features = false, version = "^4.0" }
cap-std = { default-features = false, version = "^4.0" }
cargo_metadata = { default-features = false, version = "^0.23" }
clap = { default-features = false, version = "^4", features = ["derive", "std"] }
clap_complete = { default-features = false, version = "^4" }
codama-nodes = { default-features = false, version = "0.13.1" }
comfy-table = { default-features = false, version = "^8.0.0" }
darling = { default-features = false, version = "0.24.0" }
ed25519-dalek = { version = "3.0.0", default-features = false }
flate2 = { default-features = true, version = "1.1.2" }
fs2 = { default-features = false, version = "^0.4" }
getrandom = { default-features = false, version = "0.4.2" }
heck = { default-features = false, version = "^0.5" }
http = { default-features = false, version = "^1" }
insta = { default-features = false, version = "^1" }
insta-cmd = { default-features = false, version = "^0.7.0" }
macrotest = { default-features = false, version = "^1.2" }
mollusk-svm = { default-features = false, version = "0.14.0" }
num-derive = { version = "^0.5", default-features = false }
num-traits = { version = "^0.2", default-features = false }
object = { default-features = false, version = "^0.40.0" }
owo-colors = { default-features = false, version = "^4.0" }
paste = { default-features = false, version = "^1" }
pastey = { default-features = false, version = "^0.2" }
pina_test = { path = "crates/pina_test", version = "0.15.0" }
pinapod = { version = "0.2", default-features = false, features = ["solana-address", "solana-program-error"] }
pinocchio = { default-features = false, version = "^0.11", features = ["cpi"] }
pinocchio-associated-token-account = { default-features = false, version = "^0.4" }
pinocchio-memo = { default-features = false, version = "^0.4" }
pinocchio-system = { default-features = false, version = "^0.6" }
pinocchio-token = { default-features = false, version = "^0.7" }
pinocchio-token-2022 = { default-features = false, version = "^0.4" }
prettyplease = { default-features = false, version = "^0.3" }
proc-macro2 = { default-features = false, version = "^1" }
proptest = { default-features = false, version = "^1", features = ["std"] }
quote = { default-features = false, version = "^1" }
rayon = { default-features = false, version = "^1.10" }
same-file = { default-features = false, version = "^1" }
semver = { default-features = false, version = "^1" }
serde = { default-features = false, version = "^1" }
serde_json = { default-features = false, version = "^1", features = ["std"] }
sha2 = { default-features = false, version = "^0.11" }
solana-account = { version = "^4", default-features = false }
solana-account-info = { version = "^3", default-features = false }
solana-address = { default-features = false, version = "^2.0", features = ["bytemuck", "curve25519", "decode"] }
solana-cpi = { version = "^3", default-features = false }
solana-instruction = { version = "^3", default-features = false }
solana-program-error = { version = "^3", default-features = false }
solana-program-log = { default-features = false, version = "^1.1" }
solana-pubkey = { version = "^4", features = ["bytemuck"], default-features = false }
solana-sdk-ids = { version = "^3", default-features = false }
solana-system-interface = { version = "^3", default-features = false }
syn = { default-features = false, version = "^3", features = ["full"] }
tar = { default-features = false, version = "^0.4" }
tempfile = { default-features = false, version = "^3" }
termimad = { default-features = false, version = "^0.35.1" }
thiserror = { default-features = false, version = "^2" }
tokio = { default-features = false, version = "^1" }
toml = { default-features = false, version = "^1", features = ["parse", "serde"] }
trybuild = { default-features = false, version = "^1" }
ureq = { default-features = false, version = "^3", features = ["json", "rustls"] }
url = { default-features = false, version = "^2.5.4" }
walkdir = { default-features = false, version = "^2" }

# publishable crates
pina = { default-features = false, path = "crates/pina", version = "0.15.0" }
pina_abi = { default-features = false, path = "crates/pina_abi", version = "0.15.0" }
pina_cli = { default-features = false, path = "crates/pina_cli", version = "0.15.0" }
pina_codama_renderer = { default-features = false, path = "crates/pina_codama_renderer", version = "0.15.0" }
pina_cpi_renderer = { default-features = false, path = "crates/pina_cpi_renderer", version = "0.15.0" }
pina_lints = { default-features = false, path = "crates/pina_lints", version = "0.15.0" }
pina_macros = { default-features = false, path = "crates/pina_macros", version = "0.15.0" }
pina_profile = { default-features = false, path = "crates/pina_profile", version = "0.15.0" }
pina_sdk_ids = { default-features = false, path = "crates/pina_sdk_ids", version = "0.15.0" }

[workspace.metadata.bin]
# `cargo-expand` is installed directly by `test:all`. The pinned release has no
# quick-install artifact, and cargo-run-bin cannot combine its Cargo fallback
# with the project-local install path.
cargo-semver-checks = { version = "0.50.0" }
cargo-workspaces = { version = "0.4.2" }
hyperfine = { version = "1.19.0" }

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# individual lints
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
	'cfg(coverage)',
	'cfg(kani)',
	'cfg(target_os, values("solana"))',
	'cfg(target_feature, values("static-syscalls"))',
]

[workspace.lints.clippy]
# group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
