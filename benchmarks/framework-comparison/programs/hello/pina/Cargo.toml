[package]
name = "hello_pina"
version = "0.0.0"
edition = "2021"
publish = false

# Detached from the repository workspace: the comparison pins foreign framework
# revisions that must never leak into the published workspace lockfile.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
pina = { path = "../../../../../crates/pina", features = ["logs", "derive"] }
