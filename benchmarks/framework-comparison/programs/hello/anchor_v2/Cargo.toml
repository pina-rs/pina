[package]
name = "hello_anchor_v2"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# `no-log-ix-name` drops the per-call instruction-name log line that Anchor
# otherwise emits; it is the difference between the 2,728 and 1,880 byte builds.
default = ["no-log-ix-name"]
no-log-ix-name = []
no-entrypoint = []

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "e4878b6d2c93064957cc78930b84e4431d6f955c", default-features = false, features = ["alloc"] }
bytemuck = { version = "1", features = ["derive"] }
pinocchio = { version = "0.11", default-features = false, features = ["copy"] }
solana-program-error = "3.0"
wincode = { version = "0.5", features = ["derive"] }

[lints.rust.unexpected_cfgs]
level = "allow"
