[package]
name = "counter_anchor_v2"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["no-log-ix-name"]
no-log-ix-name = []
no-entrypoint = []

[dependencies]
anchor-lang = { version = "=2.0.0-rc.2", default-features = false, features = [
	"alloc",
] }
bytemuck = { version = "1", features = ["derive"] }
pinocchio = { version = "0.11", default-features = false, features = ["copy"] }
solana-program-error = "3.0"
wincode = { version = "0.6", features = ["derive"] }

[lints.rust.unexpected_cfgs]
level = "allow"
