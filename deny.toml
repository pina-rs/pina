[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
# The libgit2 fetch cargo-deny uses by default fails silently on the CI
# runners (the database clones but loads empty), so fetch through the git
# CLI instead. The advisory check itself is unchanged.
git-fetch-with-cli = true
# An exception that no longer matches the graph fails the gate, so a dependency
# upgrade that removes an advisory cannot leave a stale suppression behind.
unused-ignored-advisory = "deny"
# This list is the repository's single advisory policy: `security:deny` runs
# the advisories check, and `security:audit` passes no ignore list of its own.
#
# Except for crypto-bigint and zstd's additional host CLI paths documented below,
# every entry is reachable only from the host-side dev/test stack
# (surfpool, litesvm, mollusk, solana-runtime, and the Agave precompile host
# crates) pulled in through `pina_test` and the `*/tests/surfpool` harnesses.
# Those dev/test-only dependencies do not appear in the graph of a runtime crate
# (`pina`, `pina_abi`, `pina_macros`, `pina_cli`, `pina_profile`), and none is
# compiled into an on-chain program. `pina_test` is published too, as a
# host-side test harness, so its dependents do pull in this stack. Verify the
# runtime crates with, for example:
#
#   cargo tree -i unsafe-libyaml@0.2.11 -p pina -p pina_abi -p pina_macros -p pina_cli
#
# `cargo-deny` cannot see these crates under its default roots (a virtual
# manifest roots the graph at the workspace members' normal dependencies, so
# the dev/test stack is absent and these advisories never fire). The reachability
# claims above were verified against `cargo tree -i <spec> --workspace
# --all-features --target all`, which does include dev edges.
#
# Review date: 2026-10-28. Re-check on each dependency-train bump; each
# suppression below should become an upstream upgrade rather than accumulate.
# Each entry also needs a tracking issue filed on the repository (see the
# accompanying changeset); this file cannot open one itself.
ignore = [
	# RUSTSEC-2021-0139: ansi_term is unmaintained. Reached via
	# surfpool-core → hiro-system-kit → ansi_term. Host/test stack only
	# (via surfpool/litesvm, not in any runtime crate graph).
	"RUSTSEC-2021-0139",
	# RUSTSEC-2024-0375: atty is unmaintained. Reached via
	# surfpool-core → hiro-system-kit → atty. Host/test stack only
	# (via surfpool/litesvm, not in any runtime crate graph).
	"RUSTSEC-2024-0375",
	# RUSTSEC-2025-0141: bincode is unmaintained. Reached via
	# litesvm/solana-runtime → agave-precompiles → bincode. Host/test stack
	# only (via surfpool/litesvm, not in any runtime crate graph).
	"RUSTSEC-2025-0141",
	# RUSTSEC-2024-0388: derivative is unmaintained. Reached via
	# solana-poseidon → ark-bn254 → ark-ec → derivative. Host/test stack only
	# (via surfpool/litesvm, not in any runtime crate graph).
	"RUSTSEC-2024-0388",
	# RUSTSEC-2025-0161: libsecp256k1 is unmaintained. Reached via
	# litesvm → agave-precompiles → libsecp256k1 and solana-program →
	# solana-secp256k1-recover. Host/test stack only (via surfpool/litesvm,
	# not in any runtime crate graph).
	"RUSTSEC-2025-0161",
	# RUSTSEC-2024-0436: paste is no longer maintained. Reached via
	# solana-poseidon → ark-bn254 → ark-ff → paste. Host/test stack only
	# (via surfpool/litesvm, not in any runtime crate graph).
	"RUSTSEC-2024-0436",
	# RUSTSEC-2024-0384: instant is unmaintained. Reached via
	# surfpool-core → jsonrpc-http-server → parking_lot 0.11 → instant.
	# Host/test stack only (via surfpool/litesvm, not in any runtime crate
	# graph).
	"RUSTSEC-2024-0384",
	# RUSTSEC-2020-0016: net2 is deprecated. Reached via
	# surfpool-core → jsonrpc-http-server → net2. Host/test stack only
	# (via surfpool/litesvm, not in any runtime crate graph).
	"RUSTSEC-2020-0016",
	# RUSTSEC-2022-0093: ed25519-dalek double-public-key signing oracle.
	# Reached via litesvm → agave-precompiles → ed25519-dalek 1.0.1.
	# Host/test stack only (via surfpool/litesvm, not in any runtime crate
	# graph). The workspace's own ed25519-dalek is 3.0.0.
	"RUSTSEC-2022-0093",
	# RUSTSEC-2024-0344: curve25519-dalek Scalar sub timing variability.
	# Reached via ed25519-dalek 1.0.1 → curve25519-dalek 3.2.0 in the
	# host/test stack only. The workspace's own curve25519-dalek is 4.1.3.
	"RUSTSEC-2024-0344",
	# RUSTSEC-2024-0421: idna accepts non-decoding Punycode labels. Reached
	# via surfpool-core → jsonrpc-client-transports → url 1.7.2 → idna 0.1.5.
	# Host/test stack only (via surfpool/litesvm, not in any runtime crate
	# graph).
	"RUSTSEC-2024-0421",
	# RUSTSEC-2025-0055: tracing-subscriber logs user input without escaping
	# ANSI sequences. Reached via ark-relations → ark-groth16 → the privacy
	# pool's Surfpool harness. Host/test stack only (the proving stack never
	# compiles into an on-chain program; `not(target_os = "solana")` gates
	# the module).
	"RUSTSEC-2025-0055",
	# RUSTSEC-2024-0449: unsafe-libyaml is unmaintained (archived upstream,
	# no safe upgrade). Reached via pina_test → surfpool-sdk → surfpool-core →
	# serde_yaml (deprecated) → unsafe-libyaml 0.2.11. Host/test stack only
	# (via surfpool, not in any runtime crate graph). Removable once surfpool
	# drops serde_yaml — tracked in #619.
	"RUSTSEC-2024-0449",
	# RUSTSEC-2026-0387: crypto-bigint 0.5.5 has variable-time arithmetic.
	# Reached through elliptic-curve 0.13 → k256 0.13 from both Surfpool's
	# txtx-addon-kit → bip32 test-key derivation and Solana's host-side
	# secp256k1 recovery. The latter also reaches generated CLI applications
	# through solana-sdk → solana-program → solana-secp256k1-recover; it is
	# public-input signature recovery, not secret-key arithmetic. No on-chain
	# program includes this dependency. This exception accepts the remaining
	# timing risk in the host test stack; it does not claim the crate is fixed.
	# Patched releases start at 0.7.6, incompatible with elliptic-curve 0.13.
	# Reviewed 2026-10-24. Remove when the Surfpool/BIP32 and Solana recovery
	# dependency trains both resolve crypto-bigint >=0.7.6 — tracked in #654.
	"RUSTSEC-2026-0387",
	# Agave 4.3.2 requires zstd ^0.13.3; the fixed zstd 0.14.3 / zstd-safe
	# 8.2.0 releases are incompatible. Agave's fix is merged on master:
	# https://github.com/anza-xyz/agave/pull/16391
	# scripts/check-zstd-advisories.ts enforces a 2026-11-25 expiry and the
	# exact reviewed direct consumers before either security audit runs.
	# A new consumer or version must fail until its call sites are reviewed.
	# The account-decoder crates also reach generated host CLI applications;
	# this is not a claim that all zstd use is confined to the test harness.
	# Reviewed 2026-10-28. Remove after the supported Solana train upgrades:
	# https://github.com/pina-rs/pina/issues/669
	# RUSTSEC-2026-0391: only borrowed with_context constructors are affected.
	# All four call sites in these three crates construct fresh Encoder::new,
	# Decoder::new, or Decoder::with_buffer contexts; none reuses a context.
	{ id = "RUSTSEC-2026-0391", reason = "Guarded consumers create fresh contexts; expires 2026-11-25" },
	# RUSTSEC-2026-0398: requires zstd-safe's seekable feature. Its only
	# consumer is zstd 0.13.3, which does not expose or enable that feature.
	{ id = "RUSTSEC-2026-0398", reason = "Guarded consumer cannot enable seekable; expires 2026-11-25" },
	# RUSTSEC-2026-0403: affects Vec-backed streaming write decoders. The
	# consumers above use only encoders and streaming read decoders, which
	# the advisory explicitly identifies as unaffected. The 0391 caller check
	# also guards this call-site review against added or updated consumers.
	{ id = "RUSTSEC-2026-0403", reason = "Guarded consumers use unaffected read decoders; expires 2026-11-25" },
]

[licenses]
allow = [
	# enum-iterator and enum-iterator-derive (solana-svm feature enumeration).
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	# webpki-roots distributes Mozilla's public certificate trust-store data.
	"CDLA-Permissive-2.0",
	# tiny-keccak (surfpool's keccak256 precompile stack).
	"CC0-1.0",
	# libbz2-rs-sys (surfpool's snapshot archives).
	"bzip2-1.0.6",
	"ISC",
	"MIT",
	"MPL-2.0",
	"OpenSSL",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
	"https://github.com/rust-lang/crates.io-index",
]
allow-git = [
	# crates.io releases compatible with the Solana dev dependencies are yanked.
	# Cargo.toml and Cargo.lock pin this source to an exact upstream revision.
	"https://github.com/droundy/arrayref.git",
]
