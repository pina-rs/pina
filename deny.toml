[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# RUSTSEC-2025-0141: bincode is unmaintained. Transitive dev-dependency
	# (mollusk-svm, solana-account) — not shipped in any on-chain program.
	"RUSTSEC-2025-0141",
	# RUSTSEC-2024-0388: derivative is unmaintained. Transitive dev-dependency
	# (mollusk-svm → solana-syscalls → solana-poseidon → ark-bn254) — not
	# shipped in any on-chain program.
	"RUSTSEC-2024-0388",
	# RUSTSEC-2025-0161: libsecp256k1 is unmaintained. Transitive dev-dependency
	# (mollusk-svm) — not shipped in any on-chain program.
	"RUSTSEC-2025-0161",
	# RUSTSEC-2024-0436: paste is no longer maintained. Transitive dev-dependency
	# (mollusk-svm) — not shipped in any on-chain program.
	"RUSTSEC-2024-0436",
]

[licenses]
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	# webpki-roots distributes Mozilla's public certificate trust-store data.
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"MPL-2.0",
	"OpenSSL",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
	"https://github.com/rust-lang/crates.io-index",
]
allow-git = [
	# crates.io releases compatible with the Solana dev dependencies are yanked.
	# Cargo.toml and Cargo.lock pin this source to an exact upstream revision.
	"https://github.com/droundy/arrayref.git",
]
