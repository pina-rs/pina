# Coverage accounting scope: generated clients are verified by deterministic
# regeneration and language-specific contract suites. The Surfpool harness and
# example integration packages are exercised by real-runtime suites that cannot
# run inside the CI coverage job. These paths are excluded from patch targets.
ignore:
  - "codama/clients"
  - "crates/pina_test"
  - "pina_root"
  - "examples"
  # Lint passes read rustc's internal data structures through the
  # `rustc_private` APIs, so their bodies only ever execute inside the bundled
  # `pina_lint_driver` — codecov cannot instrument a process it does not link.
  # `crates/pina_lints/tests/ui` compiles every fixture through that driver
  # and compares the diagnostics byte for byte, and each lint's decision logic
  # is factored into a host-tested module (`crates/pina_lints/src/collisions.rs`
  # is at 100%), so this excludes only the rustc-glue layer.
  - "crates/pina_lints/src/lints"
  # `crates/pina_lints/src/shared.rs` hosts the collector those lints walk the
  # HIR with: `collect_function_facts` and its `collect_from_*` helpers take
  # `LateContext`/`Expr` values that exist only inside the driver process, so
  # their bodies are the same rustc-glue class as the lint passes. The
  # pure-string helpers the collector shares with host tests
  # (`expression_identity` and friends) stay reachable; the HIR-walking
  # region has never been covered by the instrumented run — the
  # `tests/ui` fixtures are the behavioral gate for it.
  - "crates/pina_lints/src/shared.rs"

coverage:
  status:
    patch:
      default:
        target: 100%
