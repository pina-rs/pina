[target.bpfel-unknown-none]
rustflags = [
	"-C",
	"linker=sbpf-linker",
	"-C",
	"panic=abort",
	"-C",
	"save-temps",
	"-C",
	"link-arg=--llvm-args=-bpf-stack-size=4096",
	"-C",
	"relocation-model=static",
]

[alias]
build-bpf = "build --release --target bpfel-unknown-none -p pina_bpf -F bpf-entrypoint -Z build-std=core,alloc"
build-escrow-program = "build-sbf --manifest-path examples/escrow_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-profile-program = "build-sbf --manifest-path examples/profile_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
dylint = ["bin", "cargo-dylint"]
semver-checks = ["bin", "cargo-semver-checks"]
workspaces = ["bin", "cargo-workspaces"]
kani = ["bin", "cargo-kani"]
