# Upstream Rust builds for the `bpfel-unknown-none` target, linked with the
# pinned `sbpf-linker` (see `[workspace.metadata.bin]` in Cargo.toml). This is
# the blueshift-gg/solana-upstream-bpf-template flag set; sbpf-linker 0.2.3 or
# newer is required.
#
# The two `--cfg` flags are load-bearing: they enable pinocchio's static
# syscall path, which encodes syscall calls as murmur3-hash immediates with no
# relocation tables. Without them the syscall externs fall back to
# relocation-based resolution that sbpf-linker mishandles on this target,
# producing programs that load but silently corrupt data — see
# docs/sbpf-linker-evaluation.md.
#
# LTO is deliberately absent: fat LTO under sbpf-linker inflates runtime
# compute units by 17-77% on pina examples and makes u128 division
# (`__udivti3`) unresolvable at link time.
[target.bpfel-unknown-none]
rustflags = [
	"-C",
	"linker=sbpf-linker",
	"-C",
	"panic=abort",
	"-C",
	"relocation-model=static",
	"-C",
	"target-cpu=v4",
	"-C",
	"target-feature=+allows-misaligned-mem-access",
	"-C",
	"link-arg=--llvm-args=--bpf-stack-size=4096",
	"-C",
	"link-arg=--llvm-args=--bpf-max-stores-per-memfunc=5",
	"-C",
	"link-arg=--llvm-args=--disable-gotox",
	"-C",
	"link-arg=--llvm-args=--disable-ldsx",
	"-C",
	"link-arg=--llvm-args=--disable-movsx",
	"--cfg=target_os=\"solana\"",
	"--cfg=target_feature=\"static-syscalls\"",
	"-A",
	"explicit_builtin_cfgs_in_flags",
]

[alias]
# `--lto` requests fat link-time optimization. cargo-build-sbf only accepts it
# when the program's `[lib] crate-type` is `["cdylib"]` alone — a second
# rlib/lib output in the same rustc invocation turns `-C lto` into an error —
# so the flag is carried only by aliases for programs that qualify
# (escrow today; see docs/src/program-size.md). Fat LTO cut the escrow
# example from 73,976 to 46,680 bytes (-37%) and its static CU by 34%.
build-pina-bpf-program = "build-sbf --manifest-path examples/pina_bpf_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint,cpi-runtime-tests --lto"
build-escrow-program = "build-sbf --manifest-path examples/escrow_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-heap-alloc-program = "build-sbf --manifest-path examples/heap_alloc_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-migrations-program = "build-sbf --manifest-path examples/migrations_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-multisig-program = "build-sbf --manifest-path examples/multisig_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-optional-accounts-program = "build-sbf --manifest-path examples/optional_accounts_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-privacy-pool-program = "build-sbf --manifest-path examples/privacy_pool_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-profile-program = "build-sbf --manifest-path examples/profile_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-role-registry-program = "build-sbf --manifest-path examples/role_registry_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-staking-rewards-program = "build-sbf --manifest-path examples/staking_rewards_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
build-vesting-program = "build-sbf --manifest-path examples/vesting_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint --lto"
# Upstream sbpf-linker build for the showcase example; deliberately no LTO
# (see the target comment above). Requires a nightly toolchain with `rust-src`
# because of build-std. rustc resolves `sbpf-linker` from PATH.
build-upstream-bpf-program = "build --release --target bpfel-unknown-none -p upstream_bpf_program --features bpf-entrypoint -Z build-std=core,alloc"
semver-checks = ["bin", "cargo-semver-checks"]
workspaces = ["bin", "cargo-workspaces"]
kani = ["bin", "cargo-kani"]
hyperfine = ["bin", "hyperfine"]
sbpf-linker = ["bin", "sbpf-linker"]
