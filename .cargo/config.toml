[target.bpfel-unknown-none]
rustflags = [
	"-C",
	"linker=sbpf-linker",
	"-C",
	"panic=abort",
	"-C",
	"save-temps",
	"-C",
	"link-arg=--llvm-args=-bpf-stack-size=4096",
	"-C",
	"relocation-model=static",
]

[alias]
build-pina-bpf-program = "build-sbf --manifest-path examples/pina_bpf_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint,cpi-runtime-tests"
build-escrow-program = "build-sbf --manifest-path examples/escrow_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-migrations-program = "build-sbf --manifest-path examples/migrations_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-multisig-program = "build-sbf --manifest-path examples/multisig_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-optional-accounts-program = "build-sbf --manifest-path examples/optional_accounts_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-profile-program = "build-sbf --manifest-path examples/profile_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-role-registry-program = "build-sbf --manifest-path examples/role_registry_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-staking-rewards-program = "build-sbf --manifest-path examples/staking_rewards_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
build-vesting-program = "build-sbf --manifest-path examples/vesting_program/Cargo.toml --sbf-out-dir target/deploy --features bpf-entrypoint"
semver-checks = ["bin", "cargo-semver-checks"]
workspaces = ["bin", "cargo-workspaces"]
kani = ["bin", "cargo-kani"]
hyperfine = ["bin", "hyperfine"]
