[package]
name = "pina_test"
version = "0.12.0"
edition = "2024"
homepage = "https://pina.rs"
keywords = ["solana", "pinocchio", "surfpool", "testing"]
license = "Apache-2.0"
publish = true
readme = "readme.md"
repository = "https://github.com/pina-rs/pina"
rust-version = "1.89.0"
description = "Host-side Surfpool integration test support for Pina programs"

[dependencies]
# Surfpool train anchors. `pina init` generates downstream Surfpool test
# packages without a lockfile, so this crate is the only place the Agave
# 4.1 train that Surfpool 1.5 ships on can be anchored. These tilde ranges
# track the compatibility set the resolver proves out in this workspace:
# Agave keeps republishing interface crates onto newer serialization stacks
# mid-train (for example `solana-fee-calculator` 3.3 moved to `wincode` 0.6
# while `solana-message` 4.4 still serializes with 0.5), and an unanchored
# resolve mixes the two into a graph that cannot compile. Tildes keep patch
# drift while holding the train; nothing here is an exact pin.
solana-account = "~4.3"
solana-address = "~2.6"
solana-client = "~4.1"
solana-clock = "~3.1"
solana-epoch-rewards = "~3.1"
solana-epoch-schedule = "~3.2"
solana-fee-calculator = "~3.2"
solana-hash = "~4.5"
solana-instruction = "~3.4"
solana-keypair = "~3.1"
solana-last-restart-slot = "~3.1"
solana-message = "~4.4"
solana-pubkey = "~4.2"
solana-rent = "~4.3"
solana-reward-info = "~6.2"
solana-rpc-client = "~4.1"
solana-runtime = "~4.1"
solana-short-vec = "~3.2"
solana-signature = "~3.4"
solana-signer = "~3.0"
solana-slot-history = "~3.1"
solana-stake-history = "~1.0"
solana-transaction = "~4.1"
surfpool-sdk = "~1.5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"
unstable_features = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_dependencies = "deny"
