[package]
name = "pina_fuzz_targets"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
# The example programs are cdylib-only, so the fuzz targets depend on the
# re-export crates each program carries under its own `fuzz/` directory:
# migration-aware macros only expand when `migrations/manifest.json` is
# discoverable, which holds inside the program's tree, and the wrapper's
# rlib carries the already-expanded codegen.
[dependencies]
counter_program_fuzz = { path = "../../../examples/counter_program/fuzz" }
libfuzzer-sys = "0.4"
migrations_program_fuzz = { path = "../../../examples/migrations_program/fuzz", features = ["fuzzing"] }
pina = { path = "../../pina" }
pina_fuzz = { path = ".." }
role_registry_program_fuzz = { path = "../../../examples/role_registry_program/fuzz" }

[[bin]]
name = "account_deserialize"
path = "fuzz_targets/account_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_instruction"
path = "fuzz_targets/parse_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_decode"
path = "fuzz_targets/migration_decode.rs"
test = false
doc = false
bench = false
