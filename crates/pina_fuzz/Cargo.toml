[package]
name = "pina_fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
# The example programs are cdylib-only, so nothing can depend on their
# rlibs; the fuzz targets reach them through each program's `fuzz/`
# re-export crate instead. This crate keeps only the shared harness doc
# module.
[dependencies]
libfuzzer-sys = "0.4"
pina = { path = "../../crates/pina", features = ["logs", "derive"] }
