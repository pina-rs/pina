[package]
name = "pina_abi"
# Deliberately literal rather than `{ workspace = true }`. This crate owns its
# own release group so the version recorded in `ABI_VERSION` can track it
# without moving on every `core` release. The breaking changeset below carries
# this to 0.20.0, where it meets the committed `ABI_VERSION`.
version = "0.20.0"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = true
readme = "readme.md"
repository.workspace = true
description = "Canonical ABI history model shared by Pina migration tooling and macros"

[dependencies]
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
schemars = { workspace = true, default-features = true, features = ["derive"] }
semver = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true, default-features = true }
sha2 = { workspace = true, default-features = true }
syn = { workspace = true, default-features = true, features = ["full", "printing"] }

[lints]
workspace = true
