[package]
name = "pina"
version = { workspace = true }
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
description = "a solana and pinocchio smart contract framework"

[features]
default = ["logs", "derive"]
# Enables the heap: forwards `alloc` to pinocchio and makes
# `nostd_entrypoint_alloc!` available. Without it, `nostd_entrypoint!` denies
# allocation and dynamic allocation aborts at runtime. Leave it off unless a
# program actually needs `Box`, `Vec`, or the slice-based CPI helpers.
alloc = ["pinocchio/alloc"]
# Static, allocation-free diagnostics. Failure paths log a fixed message so
# programs do not link `core::fmt`.
logs = ["dep:solana-program-log"]
# Adds formatted diagnostics and caller locations to failure paths. Implies
# `logs`. Keep this off for deployed programs: `core::fmt` is the single
# largest avoidable size cost in a Pina binary.
verbose-logs = ["logs"]
token = [
	"dep:pinocchio-associated-token-account",
	"dep:pinocchio-token",
	"dep:pinocchio-token-2022",
]
memo = ["dep:pinocchio-memo"]
# Account reallocation. Required by the reserved `Migrate` route that
# `#[discriminator(entrypoint)]` generates, so `pina init` scaffolds it; a
# program whose accounts never grow can leave it off.
account-resize = ["pinocchio/account-resize", "pinocchio-system/account-resize"]
derive = ["dep:pina_macros"]
compact = ["derive", "pina_macros/compact"]
fixed = ["dep:fixed", "derive", "pinapod/fixed"]
floats = ["derive", "pinapod/floats"]
validation = ["derive", "pina_macros/validation"]

[dependencies]
fixed = { workspace = true, optional = true }
pastey = { workspace = true, default-features = true }
pina_macros = { workspace = true, optional = true }
pinapod = { workspace = true, default-features = true }
pinocchio = { workspace = true, default-features = false, features = ["copy", "sha2"] }
pinocchio-associated-token-account = { workspace = true, optional = true, default-features = true }
pinocchio-memo = { workspace = true, optional = true, default-features = true }
pinocchio-system = { workspace = true, default-features = true }
pinocchio-token = { workspace = true, optional = true, default-features = true }
pinocchio-token-2022 = { workspace = true, optional = true, default-features = true }
solana-address = { workspace = true, default-features = true }
solana-program-log = { workspace = true, optional = true, features = ["macro"], default-features = true }

[dev-dependencies]
proptest = { workspace = true, default-features = true }
trybuild = { workspace = true, default-features = true }

[lints]
workspace = true
